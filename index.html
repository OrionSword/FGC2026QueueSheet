<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2330">
<meta name="mobile-web-app-capable" content="yes">
<title>FGC Queue Sheet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS home screen: needs a PNG icon (no SVG); the title is the label under it. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Queue Sheet">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface2: #eceef2; --text: #14181f; --muted: #5b6474;
  --line: #d5d9e0; --head: #1b2330; --head-text: #ffffff;
  --red: #c62828; --red-bg: #fdecec; --blue: #1e5bc6; --blue-bg: #e9f0fd;
  --ok: #1b7f3b; --ok-bg: #d6f5df; --rep: #9a5b00; --rep-bg: #ffe9b8;
  --unk: #b0006d; --unk-bg: #ffd6ee; --queue: #b35c00; --queue-bg: #fff1dc;
  --deck: #0e7490; --deck-bg: #d5f6fb; --onf: #1b7f3b; --onf-text: #ffffff;
  --done: #4a5260; --late: #b3261e; --early: #1b7f3b;
  /* Field colours used at the event: 1 orange, 2 pink, 3 purple, 4 light blue, 5 green. */
  --brk: #00838f; --brk-bg: #e0f7fa; --eod: #1b2330; --eod-line: #1b2330;
  --f1: #f57c00; --f2: #ec4899; --f3: #7b2cbf; --f4: #4fc3f7; --f5: #2e9e44;
  --accent: #1e5bc6; --rp: #6d28d9; --rp-bg: #efe7ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1218; --surface: #181d26; --surface2: #222935; --text: #eef1f6; --muted: #9aa4b5;
    --line: #2d3542; --head: #0b0e13; --head-text: #eef1f6;
    --red: #ff6b6b; --red-bg: #3a1c20; --blue: #7aa7ff; --blue-bg: #1a2640;
    --ok: #5fd68a; --ok-bg: #173a24; --rep: #ffc04d; --rep-bg: #3d2f12;
    --unk: #ff6ec7; --unk-bg: #48163a; --queue: #ffb057; --queue-bg: #3a2a12;
    --deck: #5ee0f5; --deck-bg: #0e2f38; --onf: #5fd68a; --onf-text: #111;
    --done: #8a93a3; --late: #ff7b72; --early: #5fd68a;
    --accent: #7aa7ff; --brk: #4dd0e1; --brk-bg: #0f2f33; --eod: #2a3345; --eod-line: #5b6880; --rp: #c4a5ff; --rp-bg: #2a1f45;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Header ---------- */
header {
  position: sticky; top: 0; z-index: 20; background: var(--head); color: var(--head-text);
  padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.hrow { display: flex; align-items: center; gap: 6px; }
.hrow + .hrow { margin-top: 6px; }
.seg { display: flex; flex: 1; background: rgba(255,255,255,.1); border-radius: 10px; padding: 3px; gap: 3px; min-width: 0; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--head-text); border-radius: 8px;
  padding: 9px 4px; font-weight: 700; font-size: 15px; white-space: nowrap; min-width: 0;
}
.seg button.on { background: #fff; color: #111; }
.seg button.on[data-unit] { background-repeat: no-repeat; background-position: bottom; background-size: 100% 5px; }
.seg button.on[data-unit="12"] { background-image: linear-gradient(90deg, var(--f1) 50%, var(--f2) 50%); }
.seg button.on[data-unit="3"] { background-image: linear-gradient(var(--f3), var(--f3)); }
.seg button.on[data-unit="45"] { background-image: linear-gradient(90deg, var(--f4) 50%, var(--f5) 50%); }
.iconbtn {
  border: 0; background: rgba(255,255,255,.1); color: var(--head-text); border-radius: 10px;
  width: 42px; height: 42px; display: grid; place-items: center; flex: none;
}
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn { position: relative; }
.iconbtn .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #ffd36b; color: #111; font-size: 11px; font-weight: 900; line-height: 18px; text-align: center; }
.sub { display: flex; gap: 4px; }
.sub button {
  border: 1px solid rgba(255,255,255,.3); background: transparent; color: var(--head-text);
  border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px;
}
.sub button.on { background: rgba(255,255,255,.9); color: #111; border-color: transparent; }
.status-line { flex: 1; font-size: 13px; min-width: 0; text-align: right; opacity: .95; }
.status-line b { font-variant-numeric: tabular-nums; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; }

/* New schedule on the server (e.g. playoff matches just published): a bar under the header. */
.updbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 6px 6px 10px; border-radius: 10px; background: #ffd36b; color: #111; font-weight: 700; font-size: 14px; }
.updbar span { flex: 1; min-width: 0; }
.updbar button { border: 0; border-radius: 8px; background: #111; color: #fff; font-weight: 800; padding: 8px 12px; white-space: nowrap; }

/* ---------- List ---------- */
main { padding: 0 max(6px, env(safe-area-inset-right)) 96px max(6px, env(safe-area-inset-left)); max-width: 1500px; margin: 0 auto; }
.dayhead {
  position: sticky; z-index: 5; background: var(--bg); color: var(--muted);
  font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
  padding: 10px 4px 6px; border-bottom: 1px solid var(--line);
}
.time .ampm { display: inline-block; font-size: .62em; font-weight: 700; margin-left: 2px; } /* inline-block: no strike-through on AM/PM */
/* Breaks detected from gaps in the schedule. Lunch: loud banner. Short break: still obvious, a step quieter. */
.brk { display: flex; align-items: center; gap: 10px; border-radius: 10px; margin: 10px 0; padding: 12px 14px; }
.brk .ico { font-size: 26px; line-height: 1; }
.brk .lbl { font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
.brk .sub { font-size: 13px; font-weight: 600; }
.brk.lunch { background: repeating-linear-gradient(135deg, #ffcf33 0 14px, #ffc107 14px 28px); color: #111; border: 3px solid #111; }
.brk.lunch .lbl { font-size: 22px; }
.brk.short { background: var(--brk-bg); color: var(--text); border: 2px dashed var(--brk); padding: 8px 12px; }
.brk.short .ico { font-size: 20px; }
.brk.short .lbl { font-size: 16px; color: var(--brk); }
.brk.eod { background: var(--eod); color: #eef1f6; border: 2px solid var(--eod-line); margin: 14px 0 10px; }
.brk.eod .lbl { font-size: 20px; }
.nowline { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12px; font-weight: 700; margin: 4px 0; }
.nowline::before, .nowline::after { content: ""; flex: 1; height: 2px; background: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

.match {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  margin: 6px 0; overflow: hidden; display: grid; gap: 4px; padding: 4px;
  grid-template-columns: 1fr 1fr; grid-template-areas: "meta meta" "red blue";
  scroll-margin-top: 140px;
}
.match.st-queue { --qc: var(--queue); border-color: var(--qc); box-shadow: 0 0 0 2px var(--qc) inset; }
.match.st-queue.q-deck { --qc: var(--deck); } .match.st-queue.q-field { --qc: var(--onf); }
.match.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: none; } }
.meta { grid-area: meta; display: flex; align-items: center; gap: 6px; padding: 2px 4px; min-width: 0; flex-wrap: wrap; }
.mid { display: flex; flex-direction: column; line-height: 1; min-width: 3.2em; background: none; border: 0; padding: 2px 0; text-align: left; }
.mtype { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.mnum { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mtype.t-practice { color: var(--muted); } .mtype.t-playoff { color: var(--unk); }
.fld { font-weight: 800; font-size: 14px; border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
.fld.f1 { background: var(--f1); color: #111; } .fld.f2 { background: var(--f2); color: #111; }
.fld.f3 { background: var(--f3); color: #fff; } .fld.f4 { background: var(--f4); color: #111; }
.fld.f5 { background: var(--f5); color: #fff; }
.time { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meta .spacer { flex: 1; }
.meta .row { display: flex; gap: 8px; align-items: center; }
.chip { border: 1.5px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip.st-queue { background: var(--queue-bg); border-color: var(--queue); color: var(--queue); }
/* Queue stage (tap the chip to advance): In queue → On deck → On field. */
.chip.q-idle { background: transparent; border-color: var(--line); color: var(--muted); font-weight: 600; font-size: 12px; padding: 5px 8px; }
/* Phone portrait: the stage badge and Mark done must fit beside the match number on one line. */
@media (max-width: 559px) {
  .meta .row { gap: 6px; }
  .meta .row .chip { padding: 5px 8px; }
  .meta .row .chip.q-idle { padding: 5px 6px; font-size: 11px; }
  .meta .startbtn { padding: 7px 9px; }
}
.startbtn .sm { display: none; }
@media (max-width: 419px) { .startbtn .lg { display: none; } .startbtn .sm { display: inline; } }
.chip.q-deck { background: var(--deck-bg); border-color: var(--deck); color: var(--deck); }
.chip.q-field { background: var(--onf); border-color: var(--onf); color: var(--onf-text); }
.chip.st-done { background: var(--surface2); color: var(--done); }
.delta { font-weight: 800; font-variant-numeric: tabular-nums; }
.delta.late { color: var(--late); } .delta.early { color: var(--early); } .delta.zero { color: var(--accent); }
.delta.none { color: var(--muted); font-weight: 600; }
.chip.rp { background: var(--rp-bg); border-color: var(--rp); color: var(--rp); }
/* The header is always dark: use light variants there. */
.status-line .delta { white-space: nowrap; }
.status-line .delta.late { color: #ff8a80; } .status-line .delta.early { color: #69f0ae; } .status-line .delta.zero { color: #9cc0ff; }
.startbtn { border: 0; background: var(--head); color: #fff; border-radius: 8px; padding: 7px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .startbtn { background: #e8ecf3; color: #111; } }

.alliance { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.alliance.red { grid-area: red; } .alliance.blue { grid-area: blue; }
/* Alliance frame + label: the alliance colour stays visible whatever the teams are marked. */
.match .alliance { --al: var(--red); position: relative; padding: 16px 2px 2px; border: 2px solid var(--al); border-radius: 9px; }
.match .alliance.blue { --al: var(--blue); }
.match .alliance::before { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: var(--al); font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; line-height: 14px; padding-left: 6px; color: #fff; }
.match .alliance.red::before { content: "Red"; } .match .alliance.blue::before { content: "Blue"; }
/* Physical orientation: blue alliance on the left (menu setting). */
.al-swap .match { grid-template-areas: "meta meta" "blue red"; }
.team {
  position: relative; display: flex; align-items: center; gap: 6px; min-height: 44px; min-width: 0;
  border: 2px solid transparent; border-left: 5px solid; border-radius: 7px; padding: 3px 26px 3px 5px; text-align: left;
}
.red .team { background: var(--red-bg); border-left-color: var(--red); }
.blue .team { background: var(--blue-bg); border-left-color: var(--blue); }
/* Official flags are drawn on 5:3 canvases; never crop them. */
.flag { width: 40px; height: 24px; flex: none; object-fit: contain; object-position: left center; }
img.flag { filter: drop-shadow(0 0 .5px rgba(0,0,0,.6)); }
.flag.ph { background: var(--surface2); border-radius: 2px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: var(--muted); object-fit: initial; }
.tname { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; min-width: 0; }
.mk { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; display: none; place-items: center; font-size: 12px; font-weight: 900; color: #fff; }
/* First visit to a unit (filled dot) or to the other field of a pair (ring), in the field's colour. Deliberately tiny. */
.fv { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(90deg, var(--fc) 50%, var(--fc2, var(--fc)) 50%); box-shadow: 0 0 0 1.5px var(--surface); pointer-events: none; }
.fv.field { background: var(--surface); border: 2px solid var(--fc); }
.fv-key { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(90deg, var(--fc) 50%, var(--fc2, var(--fc)) 50%); vertical-align: middle; }
.fv-key.ring { background: transparent; border: 2px solid var(--fc); }
.team.m-full { border-color: var(--ok); background: var(--ok-bg); }
.team.m-full .mk { display: grid; background: var(--ok); }
.team.m-rep { border-color: var(--rep); border-style: dashed; background: var(--rep-bg); border-left-style: solid; }
.team.m-rep .mk { display: grid; background: var(--rep); }
.team.m-unk { border-color: var(--unk); background: repeating-linear-gradient(135deg, var(--unk-bg) 0 8px, transparent 8px 14px), var(--unk-bg); }
.team.m-unk .mk { display: grid; background: var(--unk); }
.team.m-unk .tname { font-weight: 800; }
@media (prefers-color-scheme: dark) { .mk { color: #111; } .match .alliance::before { color: #111; } }
/* The left stripe always shows the alliance, even on marked teams. */
.red .team.team { border-left-color: var(--red); } .blue .team.team { border-left-color: var(--blue); }

/* Played / crossed-out */
/* Played matches: clearly inactive at a glance (grey, desaturated, faded) but still readable for look-ups. */
.match.st-done { background: var(--surface2); border-color: var(--line); box-shadow: none; }
.match.st-done .team.team { background: transparent; border-color: transparent; border-left-color: var(--line); }
.match.st-done .alliance { --al: var(--line); }
.match.st-done .alliance::before { color: var(--muted); }
.match.st-done .team, .match.st-done .mid, .match.st-done .time, .match.st-done .fld { opacity: .45; filter: grayscale(1); }
.match.st-done .mnum, .match.st-done .time { text-decoration: line-through; text-decoration-thickness: 2px; }

/* Medium: meta column on the left, alliances stacked */
@media (min-width: 560px) {
  .match { grid-template-columns: 8.2rem 1fr 1fr; grid-template-areas: "meta red blue"; }
  .al-swap .match { grid-template-areas: "meta blue red"; }
  .meta { flex-direction: column; align-items: flex-start; justify-content: center; gap: 5px; flex-wrap: nowrap; }
  .meta .spacer { display: none; }
  .meta .row { gap: 6px; flex-wrap: wrap; }
}
/* Wide: one row per match */
@media (min-width: 800px) {
  .match { grid-template-columns: 7.6rem 1fr 1fr; }
  .alliance { flex-direction: row; }
  .alliance .team { flex: 1 1 0; flex-direction: column; align-items: flex-start; padding: 4px 22px 4px 6px; }
  .tname { font-size: 13px; }
}
@media (min-width: 1150px) {
  .alliance .team { flex-direction: row; align-items: center; }
  .tname { font-size: 14px; }
}

/* Short screens (landscape phones): compact header */
@media (max-height: 520px) {
  header { padding-top: 4px; padding-bottom: 4px; }
  .hrow + .hrow { margin-top: 3px; }
  .seg button { padding: 5px 4px; }
  .iconbtn { width: 36px; height: 34px; }
  .sub button { padding: 2px 10px; }
  .dayhead { padding: 4px 4px 3px; }
  .team { min-height: 38px; }
  .fab { padding: 9px 14px; }
}

/* ---------- Sheets / overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); color: var(--text);
  border-radius: 16px 16px 0 0; max-height: 88vh; overflow: auto; padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto; box-shadow: 0 -6px 20px rgba(0,0,0,.3);
}
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.sheet h3, .rpl h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sheet .close { position: sticky; top: 0; float: right; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 10px 14px; font-weight: 700; min-height: 44px; }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary { background: var(--head); color: #fff; border-color: var(--head); }
.btn.danger { color: var(--late); border-color: var(--late); }
.toggle .btns { flex-wrap: nowrap; flex: none; } .toggle .btns .btn { min-width: 64px; }
.btn.sw-red.on { background: var(--red); border-color: var(--red); } .btn.sw-blue.on { background: var(--blue); border-color: var(--blue); }
@media (prefers-color-scheme: dark) { .btn.on { color: #111; } .btn.primary { background: #e8ecf3; color: #111; } }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .val { min-width: 4.5em; text-align: center; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.trow { display: grid; grid-template-columns: 1fr; gap: 4px; margin-bottom: 8px; }
.trow .who .flag { width: 50px; height: 30px; }
.trow .who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.trow .btns .btn { flex: 1; padding: 8px 6px; font-size: 13px; }
.legend { display: grid; gap: 6px; }
.legend .team { pointer-events: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; font-weight: 600; }
.toggle input { width: 22px; height: 22px; }
.note { color: var(--muted); font-size: 13px; }

/* Search */
.search {
  position: fixed; inset: 0; z-index: 45; background: var(--bg); display: flex; flex-direction: column;
}
.search .bar { display: flex; gap: 6px; padding: 8px; background: var(--head); }
.search input { flex: 1; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 0; min-width: 0; }
.search .results { overflow: auto; padding: 8px 8px 40px; }
.sres { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
.sres .who { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
.sres .who .flag { width: 60px; height: 36px; }
.sres .next { margin: 8px 0; padding: 10px; border-radius: 10px; background: var(--surface2); font-size: 16px; }
.sres .next b { font-size: 18px; }
.sres .dir { font-size: 20px; font-weight: 900; }
.slist { display: grid; gap: 3px; }
.sitem { display: grid; grid-template-columns: 5.2em 3.2em 5em 1fr 1em; align-items: center; gap: 6px; padding: 6px; border-radius: 8px; background: var(--surface2); border: 0; text-align: left; font-size: 14px; }
.sitem.past { opacity: .5; }
/* Expandable matches on team cards */
.sx > summary { list-style: none; cursor: pointer; }
.sx > summary::-webkit-details-marker { display: none; }
.sitem .chev { font-size: 20px; font-weight: 900; color: var(--muted); transition: transform .15s; text-align: center; }
.sx[open] > .sitem { opacity: 1; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 8px 8px 0 0; }
.sx[open] > .sitem .chev { transform: rotate(90deg); }
.sbody { border: 2px solid var(--accent); border-top: 0; border-radius: 0 0 10px 10px; padding: 4px; margin-bottom: 6px; }
.sbody .match { margin: 0 0 6px; }
.sbody > .btns { justify-content: flex-end; }
.tnote { display: grid; gap: 4px; margin: 8px 0; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tnote textarea { font: 500 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-transform: none; letter-spacing: 0; color: var(--text); background: var(--surface2);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; resize: vertical; min-height: 2.9em; width: 100%; }
.tnote textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.trow .who .tn { display: block; font-weight: 500; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.team.me { outline: 3px solid var(--text); outline-offset: 1px; } /* the page's own team: not an alliance colour */
.sres .who { width: 100%; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
.who .go, .trow .who .go { margin-left: auto; font-size: 22px; font-weight: 900; color: var(--muted); }

.rteam.clash { border-color: var(--late); border-style: solid; box-shadow: 0 0 0 2px var(--late) inset; }

/* Playoffs: tournament alliance on the label bar, who sits out, the alliances screen. */

/* Sitting out: faded and dashed, but the alliance stripe stays. */

/* Wide layouts put a side's teams in a row: four teams go 2 × 2 until there is room for four

.lu-unk { background: var(--unk-bg); color: var(--unk); } .lu-cell.later { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.lu-cell.lu-in.later { color: var(--ok); } .lu-cell.lu-out.later { color: var(--text); }
.lu-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; }

/* Toast */

  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60;
  background: #222; color: #fff; border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center;

  border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; padding: 13px 18px; box-shadow: 0 4px 12px rgba(0,0,0,.35);

<body>
<header>
  <div class="hrow">
    <div class="seg" id="unitSeg">
      <button data-unit="12">F1·2</button>
      <button data-unit="3">F3</button>
      <button data-unit="45">F4·5</button>
      <button data-unit="all">All</button>
    </div>
    <button class="iconbtn" id="searchBtn" aria-label="Search team">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
    </button>
    <button class="iconbtn" id="rpBtn" aria-label="Replays">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
      <span class="badge hidden" id="rpBadge"></span>
    </button>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <div class="hrow">
    <div class="sub" id="fieldSub"></div>
    <div class="status-line" id="statusLine"></div>
  </div>
  <div class="updbar hidden" id="updBar" role="status"><span id="updText"></span><button id="updBtn">Load now</button></div>
</header>
<main id="list"></main>
<button class="fab" id="nowBtn">Jump to next ⤓</button>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>

<script src="data.js"></script>
<script src="pronounce.js"></script>
<script>
"use strict";
(function () {
const D = window.FGC_DATA;
if (!D) { document.body.innerHTML = '<p style="padding:20px">data.js is missing or failed to load.</p>'; return; }
const TZ = D.event.tz || "UTC";
const TEAMS = D.teams || {};
// How to say each team's name (pronounce.js, by team code): an English respelling, stressed
// syllables in CAPITALS, and an optional tip.
const PRON = window.FGC_PRONOUNCE || {};
const UNITS = {
  "12": { label: "Fields 1 & 2", fields: [1, 2] },
  "3":  { label: "Field 3 (center)", fields: [3] },
  "45": { label: "Fields 4 & 5", fields: [4, 5] },
  "all": { label: "All fields", fields: [1, 2, 3, 4, 5] },
};
const TYPE_LABEL = { practice: "Practice", ranking: "Ranking", playoff: "Playoff" };
// Playoff matches show their stage as published ("Round Robin", "Finals").
const typeLabel = m => m.stage || TYPE_LABEL[m.type] || m.type;
const unitOf = f => f <= 2 ? "12" : f === 3 ? "3" : "45";
const MARK_CYCLE = [null, "full", "rep", "unk"];
const MARK_INFO = {
  full: { glyph: "✓", label: "Full team + robot" },
  rep: { glyph: "R", label: "Rep only (no robot)" },
  unk: { glyph: "?", label: "Not heard from / unknown" },
};

/* ---------- Playoffs (2026 Game Manual §6.4–6.7) ---------- */
// Eight four-team TOURNAMENT ALLIANCES, fixed for the rest of the event (Table 6-1: rank N,
// N+8, 25−N + a random draw). Sixteen PLAYOFF MATCHES in a fixed order (Table 6-2), four per
// alliance; the top three by total score play three FINAL MATCHES (Table 6-3). Only three of
// the four teams play each match, and every team must play at least one PLAYOFF MATCH (T01).
// The results site lists all four members of each side; who sits out is recorded here.
const PO_TABLE = [[4, 7], [5, 6], [3, 8], [1, 2], [5, 4], [3, 6], [2, 7], [1, 8], [3, 4], [2, 5], [1, 6], [7, 8], [2, 3], [1, 4], [5, 8], [6, 7]];
const FINAL_TABLE = [[1, 3], [3, 2], [2, 1]];  // by playoff rank: #1 v #3, #3 v #2, #2 v #1
const isFinal = m => m.type === "playoff" && /final/i.test(m.stage || m.name || "");
const OFFICIAL_RR = D.matches.some(m => m.type === "playoff" && !isFinal(m));
const OFFICIAL_FINALS = D.matches.some(isFinal);
// The phone's own playoff set-up (S.p), used until results.first.global publishes the matches:
// alliances typed in (al: {n: [4 codes or null]}), the field, and the start times.
function normPlayoff(p) {
  p = p && typeof p === "object" ? p : {};
  const al = {}, hhmm = (v, d) => /^\d\d:\d\d$/.test(v) ? v : d;
  for (let n = 1; n <= 8; n++) {
    const t = p.al && Array.isArray(p.al[n]) ? p.al[n] : [];
    const row = [0, 1, 2, 3].map(i => TEAMS[t[i]] ? t[i] : null);
    if (row.some(Boolean)) al[n] = row;
  }
  const top = Array.isArray(p.top) && p.top.length === 3 && new Set(p.top).size === 3 && p.top.every(n => n >= 1 && n <= 8) ? p.top.map(Number) : null;
  return { al, field: [1, 2, 3, 4, 5].includes(p.field) ? p.field : 3, start: hhmm(p.start, "14:00"), fstart: hhmm(p.fstart, "16:00"), top };
}
const KEY = "fgcq:" + D.event.id;
const PO0 = (() => { try { return normPlayoff((JSON.parse(localStorage.getItem(KEY)) || {}).p); } catch (e) { return normPlayoff(); } })();
// Alliances: as published by the site, else as typed on this phone (an alliance counts once
// its three ranked teams are in; the random-draw slot may still be empty).
const ALLIANCES = (D.alliances || []).length
  ? D.alliances.map(a => ({ n: a.n, name: a.name || `Alliance ${a.n}`, teams: a.teams.filter(c => TEAMS[c]), rounds: a.rounds || [], rank: a.rank || {} }))
  : Object.entries(PO0.al).map(([n, t]) => ({ n: +n, name: `Alliance ${n}`, teams: t.filter(Boolean), local: true, rounds: [], rank: {} }))
      .filter(a => a.teams.length >= 3 && PO0.al[a.n].slice(0, 3).every(Boolean));
const ALLIANCE_N = new Map(ALLIANCES.map(a => [a.n, a]));
const ALLIANCE_OF = new Map(ALLIANCES.flatMap(a => a.teams.map(c => [c, a])));
// The top three for the finals: from the site once it lists the finalists, else typed in.
const FINAL_TOP = (() => {
  const f = ALLIANCES.filter(a => a.rounds.some(r => /final/i.test(r)));
  if (f.length === 3 && f.every(a => a.rank.round_robin)) return f.sort((a, b) => a.rank.round_robin - b.rank.round_robin).map(a => a.n);
  return PO0.top;
})();
// Matches built on the phone from Table 6-2 / 6-3, with the same ids the site uses (t3-N,
// t4-N), so marks carry over when the official schedule arrives. Times are estimates.
const LOCAL_PO = (() => {
  if (!ALLIANCES.length) return [];
  const last = D.matches.reduce((a, m) => Date.parse(m.time) > Date.parse(a.time) ? m : a, D.matches[0]);
  const day = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(Date.parse(last.time));
  const off = (last.time.match(/([+-]\d\d:\d\d|Z)$/) || ["Z"])[0];
  const at = (hhmm, min) => new Date(Date.parse(`${day}T${hhmm}:00${off}`) + min * 60e3).toISOString();
  const out = [];
  const mk = (id, stage, n, time, a, b) => {
    const A = ALLIANCE_N.get(a), B = ALLIANCE_N.get(b);
    if (A && B) out.push({ id, type: "playoff", stage, number: n, name: `${stage} Match ${n}`, field: PO0.field, time, est: true, local: true, red: [...A.teams], blue: [...B.teams] });
  };
  // About 7 minutes apart in four blocks of four (as at past events); the real times come with the site's schedule.
  if (!OFFICIAL_RR) PO_TABLE.forEach(([a, b], i) => mk(`t3-${i + 1}`, "Round Robin", i + 1, at(PO0.start, i * 7 + Math.floor(i / 4) * 15), a, b));
  if (!OFFICIAL_FINALS && FINAL_TOP) FINAL_TABLE.forEach(([a, b], i) => mk(`t4-${i + 1}`, "Finals", i + 1, at(PO0.fstart, i * 10), FINAL_TOP[a - 1], FINAL_TOP[b - 1]));
  return out;
})();

// If the site ever lists only the three teams that play a playoff match, the alliance's fourth
// team is shown too, as sitting out (siteOut).
function fullSides(m) {
  if (m.type !== "playoff" || m.local) return {};
  const o = {};
  for (const al of ["red", "blue"]) {
    const a = ALLIANCE_OF.get(m[al][0]);
    if (a && a.teams.length === 4 && m[al].length === 3 && m[al].every(c => a.teams.includes(c))) {
      o[al] = [...a.teams]; (o.siteOut = o.siteOut || {})[al] = a.teams.find(c => !m[al].includes(c));
    }
  }
  return o;
}
const MATCHES = [...D.matches, ...LOCAL_PO].map(m => ({
  ...m, ...fullSides(m), id: m.id || `${m.type}-${m.number}-F${m.field}`, t: Date.parse(m.time), unit: unitOf(m.field),
})).sort((a, b) => a.t - b.t || a.field - b.field);
const BY_ID = new Map(MATCHES.map(m => [m.id, m]));
// A team's first visit to a unit (F1·2, F3, F4·5) or to a field, across all match types in time
// order: FIRST_VISIT.get(match id)[team code] = "unit" (new area) or "field" (other field of a pair
// it has already played on). Shown as a tiny dot on the team tile.
const FIRST_VISIT = (() => {
  const seen = new Set(), out = new Map();
  for (const m of MATCHES) for (const c of [...m.red, ...m.blue]) {
    const k = seen.has(c + "@" + m.unit) ? (seen.has(c + "#" + m.field) ? null : "field") : "unit";
    seen.add(c + "@" + m.unit); seen.add(c + "#" + m.field);
    if (k) { if (!out.has(m.id)) out.set(m.id, {}); out.get(m.id)[c] = k; }
  }
  return out;
})();

// Replays are stored next to the marks as S.r: flagged match ids, the planned order
// (plan: [{id, s: slot, f: field}]), which replays are done, and the field mode.
const REPLAY_MODES = [["auto", "Auto"], ["home", "Own pair"], ["spread", "Both pairs"], ["12", "F1·2 only"], ["45", "F4·5 only"]];
function normReplays(r) {
  r = r && typeof r === "object" ? r : {};
  const ids = Array.isArray(r.ids) ? [...new Set(r.ids.filter(id => BY_ID.has(id)))] : [];
  return {
    ids,
    plan: Array.isArray(r.plan) ? r.plan.filter(p => p && ids.includes(p.id) && Number.isInteger(p.s) && [1, 2, 4, 5].includes(p.f)) : [],
    done: Object.fromEntries(Object.keys(r.done || {}).filter(id => ids.includes(id)).map(id => [id, 1])),
    mode: REPLAY_MODES.some(([k]) => k === r.mode) ? r.mode : "auto",
    manual: !!r.manual,
  };
}

/* ---------- Persistence ---------- */
const DEFAULT_UI = { unit: "12", field: 0, hideDone: false, type: "all", wake: false, h24: false, timing: false, swap: false };
// n: free-text notes per team code (team pages). p: playoff set-up typed on this phone (normPlayoff).
// S.m[id].x: teams sitting out a playoff match (one per alliance).
let S = { v: 1, m: {}, ui: { ...DEFAULT_UI }, r: normReplays(), n: {}, p: normPlayoff(PO0) };
const normNotes = n => n && typeof n === "object" ? Object.fromEntries(Object.entries(n).filter(([, v]) => typeof v === "string" && v.trim())) : {};
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); if (p && p.m) S = { v: 1, m: p.m, ui: { ...DEFAULT_UI, ...(p.ui || {}) }, r: normReplays(p.r), n: normNotes(p.n), p: normPlayoff(PO0) }; }
} catch (e) { console.error(e); }
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; }
  catch (e) { if (!saveFailed) toast("⚠ Could not save to this device!"); saveFailed = true; }
}
// Official playoff matches with other ids than the t3-N / t4-N this phone used: move the marks.
for (const m of MATCHES) if (m.type === "playoff" && !m.local) {
  const was = `${isFinal(m) ? "t4" : "t3"}-${m.number}`;
  if (was !== m.id && S.m[was] && !S.m[m.id] && !BY_ID.has(was)) { S.m[m.id] = S.m[was]; delete S.m[was]; }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
// Another tab of the same page changed the data: pick it up.
window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { try { const p = JSON.parse(e.newValue); S.m = p.m || {}; S.r = normReplays(p.r); S.n = normNotes(p.n); S.p = normPlayoff(p.p); render(false); } catch (_) {} } });

const mk = id => S.m[id] || (S.m[id] = { t: {} });
const peek = id => S.m[id] || { t: {} };

/* ---------- Breaks ---------- */
// Found from the schedule itself: per day, gaps between event-wide match slots that are much
// longer than the normal cycle. About an hour or more = lunch; anything shorter = short break.
const BREAKS = (() => {
  const byDay = new Map();
  for (const m of MATCHES) {
    const k = fDayKey.format(m.t);
    if (!byDay.has(k)) byDay.set(k, new Set());
    byDay.get(k).add(m.t);
  }
  const out = [];
  for (const set of byDay.values()) {
    const ts = [...set].sort((a, b) => a - b);
    const gaps = ts.slice(1).map((t, i) => t - ts[i]);
    if (!gaps.length) continue;
    const cycle = [...gaps].sort((a, b) => a - b)[Math.floor(gaps.length / 2)];
    gaps.forEach((g, i) => {
      // from = last match start before the break, to = first match start after it.
      if (g >= cycle + 6 * 60e3) out.push({ from: ts[i], to: ts[i + 1], lunch: g - cycle >= 40 * 60e3 });
    });
  }
  return out;
})();
// First and last match start of each competition day (event-wide), for the end-of-day dividers.
const DAYS = new Map();
for (const m of MATCHES) {
  const k = fDayKey.format(m.t), d = DAYS.get(k);
  if (!d) DAYS.set(k, { first: m.t, last: m.t });
  else { d.first = Math.min(d.first, m.t); d.last = Math.max(d.last, m.t); }
}

/* ---------- Replay planning ---------- */
// Replays never use Field 3; they go to the side-field pairs. Each pair plays one match at a
// time and the two pairs play side by side, so a plan is a list of slots holding at most one
// match per pair. Only the order matters: no clock, no cycle time. A team in two consecutive
// slots is "back-to-back" and forces a break before the second slot.
const pairOf = f => f <= 2 ? "12" : "45";
const allianceName = al => al === "red" ? "Red" : "Blue";

// Which fields each pending replay may use. Auto: every side pair plays its own replays (F3's
// go to whichever pair is lighter) while no pair has more than two; beyond that, spread them.
function replayFields(pending, mode) {

    const n = { "12": 0, "45": 0 }; let f3 = 0;
    for (const m of pending) if (m.field === 3) f3++; else n[pairOf(m.field)]++;
    while (f3-- > 0) n[n["12"] <= n["45"] ? "12" : "45"]++;
    use = Math.max(n["12"], n["45"]) <= 2 ? "home" : "spread";
  }
  const fn = m => use === "12" ? [1, 2] : use === "45" ? [4, 5]
    : use === "home" && m.field !== 3 ? (pairOf(m.field) === "12" ? [1, 2] : [4, 5]) : [1, 2, 4, 5];
  return { use, fn };
}
function replayItem(id) {
  const m = BY_ID.get(id);

    teams: [...m.red.map(c => [c, "red"]), ...m.blue.map(c => [c, "blue"])] };

// Scores a plan (P[i] = {s, f} for items[i]; null = not placed yet) and reports what it found.
function scorePlan(items, P) {

  items.forEach((it, i) => {

    const r = ri.get(p.s), pr = pairOf(p.f);
    if (pairUse.has(r + pr)) cost += RW.pair; else pairUse.add(r + pr);
    pairSeq[pr].push([r, p.f]);

    if (p.f !== it.orig) cost += RW.moved;

      a.push({ r, f: p.f, al, i });

  for (const q of Object.values(pairSeq)) {
    q.sort((a, b) => a[0] - b[0]);

    ${SIDES.map(al => allianceHtml(m, al)).join("")}
  </div>`;
}
// One side of a match. A playoff side names its tournament alliance and, when it has four
// teams, gets a button to record who sits out.
function allianceHtml(m, al) {
  const a = sideAlliance(m, al), o = a && m[al].length === 4 ? sittingOut(m, al) : undefined;
  const btn = o === undefined || (statusOf(m) === "done" && o) || (m.siteOut && m.siteOut[al]) ? ""
    : `<button class="lineup${o ? " set" : ""}" data-act="lineup" data-m="${esc(m.id)}">${o ? `Sits out: <b>${esc(shortName(o))}</b>` : "Who sits out? ›"}</button>`;
  return `<div class="alliance ${al}${m[al].length > 3 ? " four" : ""}"${a ? ` data-al="${esc(allianceLabel(m, al))}"` : ""}>${m[al].map(c => teamHtml(m, c)).join("")}${btn}</div>`;
}

function render(scroll) {
  document.body.classList.toggle("al-swap", !!S.ui.swap);
  // Header controls
  document.querySelectorAll("#unitSeg button").forEach(b => b.classList.toggle("on", b.dataset.unit === S.ui.unit));
  const u = UNITS[S.ui.unit];
  const sub = document.getElementById("fieldSub");
  sub.innerHTML = u.fields.length > 1
    ? [0, ...u.fields].map(f => `<button data-field="${f}" class="${S.ui.field === f ? "on" : ""}">${f ? "F" + f : "Both"}</button>`).join("")
    : "";
  if (u.fields.length > 1 && S.ui.unit === "all") sub.innerHTML = [0, ...u.fields].map(f => `<button data-field="${f}" class="${S.ui.field === f ? "on" : ""}">${f || "All"}</button>`).join("");

  const ms = viewMatches();
  let html = "", lastDay = "", lastType = "", prevT = null, shownDay = "";
  for (const m of ms) {
    for (const b of BREAKS) if (prevT != null && prevT <= b.from && b.to <= m.t) html += breakHtml(b);
    prevT = m.t;
    if (S.ui.hideDone && statusOf(m) === "done") continue;
    const dk = fDayKey.format(m.t);
    // End of a competition day, unless every match of that day is hidden.
    if (shownDay && shownDay !== dk) html += endOfDayHtml(shownDay, m.t);
    shownDay = dk;
    if (dk !== lastDay || m.type + isFinal(m) !== lastType) {
      html += `<div class="dayhead">${fDay.format(m.t)} · ${esc(m.type === "playoff" ? (isFinal(m) ? "Finals" : "Playoffs") : typeLabel(m))}${m.type === "playoff" ? ` <button class="dh-btn" data-act="po">🏆 Alliances ›</button>` : ""}</div>`;
      lastDay = dk; lastType = m.type + isFinal(m);
    }
    html += matchHtml(m);
  }
  // Before the playoffs are published: where they will come from.
  if (!MATCHES.some(m => m.type === "playoff") && (S.ui.type === "all" || S.ui.type === "playoff"))
    html += `<div class="po-wait"><b>🏆 Playoffs</b> are added here as soon as results.first.global publishes them (needs internet; the phone checks every few minutes).
      <div class="btns"><button class="btn primary" data-act="update">⟳ Check now</button><button class="btn" data-act="po">Alliances…</button></div></div>`;
  listEl.innerHTML = html || `<div class="empty">No matches in this view.</div>`;
  updateReplayBadge();
  fixStickyOffset();
  placeNowLine();
  updateStatusLine();
  if (scroll) jumpToNext(false);
}

function breakHtml(b) {
  return b.lunch
    ? `<div class="brk lunch" role="separator"><span class="ico">🍴</span><div><div class="lbl">Lunch break</div><div class="sub">Last match ${hm(b.from)} · resumes <b>${hm(b.to)}</b></div></div></div>`
    : `<div class="brk short" role="separator"><span class="ico">☕</span><div><div class="lbl">Break</div><div class="sub">Last match ${hm(b.from)} · resumes <b>${hm(b.to)}</b></div></div></div>`;
}

function endOfDayHtml(dk, next) {
  return `<div class="brk eod" role="separator"><span class="ico">🌙</span><div><div class="lbl">End of day</div><div class="sub">Last match ${hm(DAYS.get(dk).last)} · resumes ${fWeekday.format(next)} <b>${hm(DAYS.get(fDayKey.format(next)).first)}</b></div></div></div>`;
}

function rerenderMatch(id) {
  const el = document.getElementById("m-" + id);
  const m = BY_ID.get(id);
  if (!el || !m) return render(false);
  if (S.ui.hideDone && statusOf(m) === "done") { el.remove(); }
  else { const tmp = document.createElement("div"); tmp.innerHTML = matchHtml(m); el.replaceWith(tmp.firstElementChild); }
  updateStatusLine();
}

function fixStickyOffset() {
  const h = document.querySelector("header").getBoundingClientRect().height;
  document.querySelectorAll(".dayhead").forEach(d => d.style.top = Math.round(document.querySelector("header").offsetHeight) + "px");
  document.documentElement.style.setProperty("--hdr", h + "px");
  document.querySelectorAll(".match").forEach(e => e.style.scrollMarginTop = (h + 40) + "px");
}

function placeNowLine() {
  document.querySelectorAll(".nowline").forEach(e => e.remove());
  const now = Date.now();
  const els = listEl.querySelectorAll(".match");
  if (!els.length) return;
  const first = BY_ID.get(els[0].dataset.m), last = BY_ID.get(els[els.length - 1].dataset.m);
  if (now < first.t - 3600e3 || now > last.t + 3600e3) return;
  for (const el of els) {
    if (BY_ID.get(el.dataset.m).t > now) {
      const n = document.createElement("div"); n.className = "nowline"; n.textContent = "NOW " + hm(now);
      (el.previousElementSibling && el.previousElementSibling.classList.contains("dayhead") ? el.previousElementSibling : el).before(n);
      return;
    }
  }
}

// The anchor match: first not-played match after the last played one in this view;
// if nothing is marked yet, the first match that is not clearly in the past.
function nextMatch(ms = viewMatches()) {
  const now = Date.now();
  let lastDone = -1;
  ms.forEach((m, i) => { if (statusOf(m) === "done") lastDone = i; });
  const afterDone = lastDone >= 0 ? ms.slice(lastDone + 1).find(m => statusOf(m) !== "done") : null;
  // Ignore a "last played" mark that is hours stale (e.g. yesterday's practice), fall back to the clock.
  if (afterDone && afterDone.t > now - 3 * 3600e3) return afterDone;
  return ms.find(m => m.t >= now - 10 * 60e3 && statusOf(m) !== "done") || (lastDone >= 0 ? afterDone : ms[0]) || null;
}
// Latest recorded start delta in this view (how far ahead/behind the unit is running).
function runningDelta(ms = viewMatches()) {
  for (let i = ms.length - 1; i >= 0; i--) { const x = peek(ms[i].id); if (x.s === "done" && x.d != null) return x.d; }
  return null;
}
function updateStatusLine() {
  const ms = viewMatches(), n = nextMatch(ms), d = S.ui.timing ? runningDelta(ms) : null;
  let s = `<span class="clock">${hm(Date.now())}</span>`;
  if (n) {
    s += ` · Next <b>${esc(n.label || n.number)}</b> F${n.field} <b>${hm(n.t)}</b>`;
    if (d) s += ` → ~<b>${hm(n.t + d * 60e3)}</b>`;
  }
  if (d != null) s += ` · <span class="delta ${deltaCls(d)}">${fmtDeltaMin(d)}</span>`;
  document.getElementById("statusLine").innerHTML = s;
}

function jumpToNext(smooth = true) {
  const n = nextMatch();
  if (!n) { window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" }); return; }
  let el = document.getElementById("m-" + n.id);
  if (!el) return;
  // Show one previous match for context.
  const prev = el.previousElementSibling;
  const target = prev && (prev.classList.contains("match") || prev.classList.contains("brk")) ? prev : el;
  target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
}

function flash(id) {
  const el = document.getElementById("m-" + id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ---------- Actions ---------- */
function cycleTeam(id, c) {
  snapshot();
  const x = mk(id);
  const cur = x.t[c] || null;
  const nxt = MARK_CYCLE[(MARK_CYCLE.indexOf(cur) + 1) % MARK_CYCLE.length];
  if (nxt) x.t[c] = nxt; else delete x.t[c];
  prune(id); save(); rerenderMatch(id);
}
function cycleStage(id) {
  snapshot();
  const m = BY_ID.get(id);
  setStage(m, mk(id), STAGES[(STAGES.indexOf(stageOf(m)) + 1) % STAGES.length]);
  prune(id); save(); rerenderMatch(id);
}
function startMatch(id) {
  snapshot();
  const m = BY_ID.get(id), x = mk(id);
  const d = clockDelta(m);
  x.s = "done";
  // Only auto-record the delta when it is plausible (i.e. we're marking it live, not catching up).
  // With start-time tracking off, a match is just crossed out and any recorded delta is left alone.
  if (S.ui.timing) { if (Math.abs(d) <= 90) x.d = d; else delete x.d; }
  save(); rerenderMatch(id);
  const earlier = openBefore(m, false);
  const label = mLabel(m);
  const actions = [["Undo", undo], ["Edit", () => openNested(() => openMatchSheet(id))]];
  if (earlier.length) actions.push([`Cross out ${earlier.length} earlier`, () => markEarlierDone(m)]);
  if (SIDES.some(al => sideAlliance(m, al) && m[al].length === 4 && !sittingOut(m, al))) actions.splice(1, 0, ["Who sat out?", () => openNested(() => openLineup(id))]);
  toast(S.ui.timing ? `${label} started${x.d != null ? ` ${fmtDeltaMin(x.d)}` : ""}` : `${label} marked done`, actions, earlier.length ? 9000 : 5000);
}
// Still-open matches listed above `m`, either in the current view or across all fields.
// Matches the volunteer reopened for a replay are left alone.
function openBefore(m, allFields) {
  const pool = allFields ? MATCHES : viewMatches();
  const i = pool.indexOf(m);
  const before = i >= 0 ? pool.slice(0, i) : pool.filter(o => o.t < m.t);
  return before.filter(o => statusOf(o) !== "done" && !(o.played && peek(o.id).s));
}
function markEarlierDone(m, allFields = false) {
  snapshot();
  const earlier = openBefore(m, allFields);
  earlier.forEach(o => { mk(o.id).s = "done"; });
  save(); render(false); flash(m.id);
  toast(`Marked ${earlier.length} earlier match${earlier.length === 1 ? "" : "es"} played`, [["Undo", undo]], 8000);
}

/* ---------- Overlays ---------- */
const overlayRoot = document.getElementById("overlayRoot");
let listDirty = false;  // set by the replay planner; the list is redrawn once it closes
// Screens opened on top of another overlay (team page from a match sheet, etc.) stack up:
// Back (phone or ‹ button) returns to the one underneath, ✕ closes them all. The overlay keeps a
// single history entry whatever the depth; Back re-adds it when it returns to a lower screen.
let navStack = [], navCur = null, navQuiet = false, navSkipPop = false;
// Every overlay calls this once it is drawn. snap() returns a function that redraws it as it is now.
function navOpened(snap) {
  navCur = snap || null;
  if (navQuiet) return;
  navStack = []; history.pushState({ overlay: 1 }, "");
}
function openNested(open) {
  if (!overlayRoot.innerHTML || !navCur) return open();
  navStack.push(navCur()); navQuiet = true;
  try { open(); } finally { navQuiet = false; }
}
// ✕ and other ways out: close at once and drop the overlay's history entry, so the phone's Back
// does not need an extra press afterwards.
function exitOverlay() {
  const pop = !!(history.state && history.state.overlay);
  closeOverlay();
  if (pop) { navSkipPop = true; history.back(); }
}
// Replace the open overlay with another, reusing its history entry.
function swapOverlay(open) {
  navStack = []; navQuiet = true;
  try { open(); } finally { navQuiet = false; }
}
const backBtn = () => navStack.length ? `<button class="iconbtn back" data-a="back" aria-label="Back">‹</button>` : "";
function closeOverlay() {
  if (noteTimer) { clearTimeout(noteTimer); noteTimer = null; save(); }
  navStack = []; navCur = null;
  overlayRoot.innerHTML = ""; document.body.style.overflow = "";
  if (listDirty) { listDirty = false; render(false); }
}
function openSheet(html, onClick, snap) {
  overlayRoot.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog">${html}</div>`;
  document.body.style.overflow = "hidden";
  overlayRoot.querySelector(".scrim").onclick = exitOverlay;
  overlayRoot.querySelector(".sheet").addEventListener("click", e => {
    const b = e.target.closest("[data-a]");
    if (!b) return;
    if (b.dataset.a === "close") return exitOverlay();
    if (b.dataset.a === "back") return history.back();
    onClick(b, e);
  });
  navOpened(snap);
}
window.addEventListener("popstate", () => {
  if (navSkipPop) { navSkipPop = false; return; }  // the entry exitOverlay() just dropped
  if (!overlayRoot.innerHTML) return;
  if (!navStack.length) return closeOverlay();
  const reopen = navStack.pop();
  navQuiet = true;
  try { reopen(); } finally { navQuiet = false; }
  history.pushState({ overlay: 1 }, "");
});
const closeBtnHtml = `<button class="btn close" data-a="close" aria-label="Close">✕</button>`;
const sheetTop = () => navStack.length ? `<button class="btn back" data-a="back">‹ Back</button>${closeBtnHtml}` : closeBtnHtml;

function openMatchSheet(id) {
  const m = BY_ID.get(id);
  const bulkHtml = () => {
    const inView = openBefore(m, false).length, all = openBefore(m, true).length;
    const viewName = UNITS[S.ui.unit].label + (S.ui.field ? ` (Field ${S.ui.field} only)` : "") + (S.ui.type !== "all" ? `, ${TYPE_LABEL[S.ui.type]}` : "");
    if (!all) return "";
    return `<h3>Catching up</h3>
      <p class="note">Mark every open match listed above this one as played. Matches reopened for a replay are left open.</p>
      <div class="btns">
        ${inView ? `<button class="btn" data-a="bulk" data-all="0">Mark ${inView} earlier played · ${esc(viewName)}</button>` : ""}
        ${all !== inView ? `<button class="btn" data-a="bulk" data-all="1">Mark ${all} earlier played · all fields</button>` : ""}
      </div>`;
  };
  const rpHtml = () => {
    const rp = replayEntry(id);
    if (!rp) return `<div class="btns" style="margin-top:8px"><button class="btn" data-a="rpon">↻ Flag for replay</button></div>`;
    return `<h3>Replay</h3>
      <p class="note">${S.r.done[id] ? "<b>Replayed ✓</b>" : `<b>Flagged for replay</b>${rp.f ? ` · slot ${rp.s + 1} on Field ${rp.f}` : ""}`}</p>
      <div class="btns"><button class="btn" data-a="rpopen">↻ Replay planner</button><button class="btn danger" data-a="rpoff">Remove replay flag</button></div>`;
  };
  const draw = () => {
    const x = peek(id);
    const sbtn = s => `<button class="btn ${stageOf(m) === s ? "on" : ""}" data-a="status" data-s="${s}">${STAGE_LABEL[s]}${s === "done" ? " ✕" : ""}</button>`;
    const trow = c => {
      const v = x.t[c] || "";
      const b = (k, l) => `<button class="btn ${v === k ? "on" : ""}" data-a="mark" data-t="${esc(c)}" data-k="${k}">${l}</button>`;
      return `<div class="trow"><button class="who" data-a="tpage" data-t="${esc(c)}">${flagHtml(c)}<span>${esc(teamName(c))}${pronHtml(c)}${S.n[c] ? `<small class="tn">📝 ${esc(S.n[c])}</small>` : ""}</span><span class="go">›</span></button>
        <div class="btns">${b("", "—")}${b("full", "✓ Full")}${b("rep", "R Rep")}${b("unk", "? Unknown")}</div></div>`;
    };
    return `${sheetTop()}<h2>${esc(mLabel(m))}</h2>
      <div class="btns" style="align-items:center">${fieldBadge(m)}<span class="time">${m.est ? "~" : ""}${hmH(m.t)}</span><span class="note">${fDay.format(m.t)}${m.est ? " · estimated time" : ""}</span></div>
      ${SIDES.some(al => sideAlliance(m, al) && m[al].length === 4) ? `<div class="btns" style="margin-top:8px"><button class="btn primary" data-a="lineup">Who sits out? ${SIDES.map(al => sideAlliance(m, al) && m[al].length === 4 ? (sittingOut(m, al) ? "✓" : "?") : "").join(" ")}</button><button class="btn" data-a="po">🏆 Alliances</button></div>` : ""}
      <h3>Status</h3>
      <div class="btns">${[...STAGES, "done"].map(sbtn).join("")}</div>
      ${rpHtml()}
      ${m.played ? `<p class="note">Listed as played on results.first.global${x.s && x.s !== "done" ? ", but reopened here (replay)" : ""}. Choose any other stage to reopen it for a replay.</p>` : ""}
      ${S.ui.timing ? `<h3>Start time vs schedule (minutes)</h3>
      <div class="stepper"><button class="btn" data-a="d" data-v="-5">−5</button><button class="btn" data-a="d" data-v="-1">−1</button>
        <span class="val delta ${x.d == null ? "none" : deltaCls(x.d)}">${x.d == null ? "—" : fmtDelta(x.d)}</span>
        <button class="btn" data-a="d" data-v="1">+1</button><button class="btn" data-a="d" data-v="5">+5</button></div>
      <div class="btns" style="margin-top:8px">${Math.abs(Date.now() - m.t) < 3 * 3600e3 ? `<button class="btn primary" data-a="dnow">Started now (${fmtDeltaMin(clockDelta(m))})</button>` : ""}<button class="btn" data-a="dzero">On time</button><button class="btn" data-a="dclear">Clear delta</button></div>
      <p class="note">${x.d == null ? "<b>Not recorded.</b> " : ""}Positive = started late, negative = started early. Setting a delta marks the match played.</p>` : ""}
      ${bulkHtml()}
      ${(S.ui.swap ? ["blue", "red"] : ["red", "blue"]).map(al => `<h3 style="color:var(--${al})">${sideAlliance(m, al) ? esc(allianceLabel(m, al)) : allianceName(al) + " alliance"}</h3>${m[al].map(trow).join("")}`).join("")}
      <div class="btns" style="margin-top:14px"><button class="btn danger" data-a="clearall">Clear all marks for this match</button></div>`;
  };
  openSheet(draw(), b => {
    if (b.dataset.a === "tpage") return openNested(() => openTeam(b.dataset.t));
    if (b.dataset.a === "lineup") return openNested(() => openLineup(id));
    if (b.dataset.a === "po") return openNested(openPlayoffs);
    if (b.dataset.a === "bulk") { exitOverlay(); markEarlierDone(m, b.dataset.all === "1"); return; }
    if (b.dataset.a === "rpopen") { swapOverlay(openReplays); return; }
    if (b.dataset.a === "rpon" || b.dataset.a === "rpoff") {
      setReplay([id], b.dataset.a === "rpon");
      const sheet = overlayRoot.querySelector(".sheet"), top = sheet.scrollTop;
      sheet.innerHTML = draw(); sheet.scrollTop = top;
      return;
    }
    snapshot();
    const x = mk(id);
    switch (b.dataset.a) {
      case "status": setStage(m, x, b.dataset.s); break;
      case "d": x.d = (x.d || 0) + Number(b.dataset.v); x.s = "done"; break;
      case "dnow": x.d = clockDelta(m); x.s = "done"; break;
      case "dzero": x.d = 0; x.s = "done"; break;
      case "dclear": delete x.d; break;
      case "mark": if (b.dataset.k) x.t[b.dataset.t] = b.dataset.k; else delete x.t[b.dataset.t]; break;
      case "clearall": if (!confirm("Clear all marks for this match?")) return; delete S.m[id]; break;
    }
    prune(id); save(); rerenderMatch(id);
    const sheet = overlayRoot.querySelector(".sheet"), top = sheet.scrollTop;
    sheet.innerHTML = draw(); sheet.scrollTop = top;
  }, () => () => openMatchSheet(id));
}

    <p class="note">${counts.done} matches played · ${counts.marks} team marks${Object.keys(S.n).length ? ` · ${Object.keys(S.n).length} team notes` : ""}. Saved automatically on every tap.</p>
    <div class="btns"><button class="btn" data-a="export">Export backup</button><button class="btn" data-a="import">Import backup</button><button class="btn danger" data-a="reset">Reset all marks, replays and notes</button></div>
    <h3>Data</h3>
    <p class="note">${MATCHES.length} matches${MATCHES.some(m => m.type === "playoff") ? ` (${MATCHES.filter(m => m.type === "playoff").length} playoff)` : ""}, ${Object.keys(TEAMS).length} teams${ALLIANCES.length ? `, ${ALLIANCES.length} playoff alliances` : ""}.<br>Source: ${esc(D.event.source || "")}${D.event.rev ? ` · rev ${esc(D.event.rev)}` : ""}</p>
    <div class="btns"><button class="btn primary" data-a="update">⟳ Check for schedule update</button></div>
    <p class="note">Playoff matches appear here once results.first.global publishes them (needs internet). The phone also checks by itself every few minutes. Your marks are kept.</p>`,
  b => {
    switch (b.dataset.a) {
      case "type": S.ui.type = b.dataset.k; save(); exitOverlay(); render(true); break;
      case "hide": S.ui.hideDone = b.checked; save(); render(false); break;
      case "wake": S.ui.wake = b.checked; save(); applyWake(); break;
      case "swap":
        S.ui.swap = b.dataset.v === "1"; save(); render(false);
        overlayRoot.querySelectorAll('[data-a="swap"]').forEach(x => x.classList.toggle("on", x === b));
        break;
      case "timing": S.ui.timing = b.checked; save(); render(false); break;
      case "h24": S.ui.h24 = b.checked; save(); setClock(); render(false); break;
      case "update": checkUpdate(true); break;
      case "po": swapOverlay(openPlayoffs); break;
      case "export": exportBackup(); break;
      case "import": importBackup(); break;
      case "reset":
        if (confirm("Erase ALL marks, replay flags and team notes on this phone? This cannot be undone (except by importing a backup).")) {
          snapshot(); S.m = {}; S.r = normReplays(); S.n = {}; save(); exitOverlay(); render(true); toast("All marks reset", [["Undo", undo]]);
        }
        break;
    }
  });
}

function exportBackup() {
  const blob = new Blob([JSON.stringify({ event: D.event.id, exported: new Date().toISOString(), m: S.m, r: S.r, n: S.n, p: S.p }, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `queue-sheet-${D.event.id}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importBackup() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    f.text().then(txt => {
      const p = JSON.parse(txt);
      if (!p || typeof p.m !== "object") throw new Error("not a backup file");
      if (p.event !== D.event.id && !confirm(`Backup is for "${p.event}", not "${D.event.id}". Import anyway?`)) return;
      snapshot(); S.m = p.m; if (p.r) S.r = normReplays(p.r); if (p.n) S.n = normNotes(p.n);
      if (p.p && JSON.stringify(normPlayoff(p.p)) !== JSON.stringify(S.p)) { S.p = normPlayoff(p.p); save(); return location.reload(); }
      save(); exitOverlay(); render(true); toast("Backup imported", [["Undo", undo]]);
    }).catch(e => alert("Could not import: " + e.message));
  };
  inp.click();
}

/* ---------- Replay planner ---------- */
const mLabel = m => `${typeLabel(m)} ${m.label || m.number}`.trim();
const plannerOpen = () => !!document.querySelector(".rpl");
function updateReplayBadge() {
  const n = S.r.ids.filter(id => !S.r.done[id]).length, b = document.getElementById("rpBadge");
  b.textContent = n; b.classList.toggle("hidden", !n);
}
function setReplay(ids, on) {
  snapshot();
  const R = S.r;
  for (const id of ids) {
    if (on) { if (!R.ids.includes(id)) R.ids.push(id); }
    else { R.ids = R.ids.filter(x => x !== id); delete R.done[id]; }
  }
  syncReplays(false); save();
  if (plannerOpen()) { listDirty = true; drawReplays(); return; }
  render(false);
  toast(`${mLabel(BY_ID.get(ids[0]))} ${on ? "flagged for replay" : "removed from replays"}`, [["Undo", undo], ...(on ? [["Planner", openReplays]] : [])]);
}
// Adds matches typed by number ("112", "112 140, 151").
function addReplays(text) {
  const nums = String(text).split(/[^0-9]+/).filter(Boolean).map(Number);
  if (!nums.length) { rpMsg = ["Type a match number.", true]; return drawReplays(); }
  const add = [], dup = [], bad = [];
  for (const n of nums) {
    const ms = MATCHES.filter(m => m.number === n);
    // If a number is used twice (e.g. practice and ranking), take the latest one already started.
    const m = ms.filter(o => o.t <= Date.now()).pop() || ms[0];
    if (!m) bad.push(n);
    else if (S.r.ids.includes(m.id) || add.includes(m.id)) dup.push(n);
    else add.push(m.id);
  }
  if (add.length) setReplay(add, true);
  rpMsg = [[add.length && `Added ${add.map(id => mLabel(BY_ID.get(id))).join(", ")}`,
    dup.length && `already listed: ${dup.join(", ")}`, bad.length && `no match ${bad.join(", ")}`].filter(Boolean).join(" · "), !add.length];
  drawReplays();
}
// Hand edits: move a replay one slot earlier/later (swapping with the match of the same pair
// there), or to another field (swapping pairs with the match that uses that pair in its slot).
function moveReplay(id, how, f) {
  const P = S.r.plan, e = P.find(p => p.id === id);
  const other = (s, pr) => P.find(p => p !== e && p.s === s && pairOf(p.f) === pr);
  if (how === "fld") {
    const o = other(e.s, pairOf(f));
    if (o) o.f = e.f;
    e.f = f;
  } else {
    const t = e.s + (how === "up" ? -1 : 1), o = other(t, pairOf(e.f));
    if (o) o.s = e.s;
    e.s = t;
  }
  renumber(P);
  S.r.manual = true;
}
function moveText(a, b) {
  if (b.r === a.r) return `⚠ Also in slot ${b.r + 1} on F${b.f} at the same time`;
  const n = Math.abs(b.f - a.f);
  const to = b.f !== a.f ? `Go to F${b.f} ${allianceName(b.al)} (${n} field${n > 1 ? "s" : ""} toward F${b.f > a.f ? 5 : 1})`
    : b.al === a.al ? `Stay at F${b.f} ${allianceName(b.al)}` : `Stay on F${b.f}, switch to ${allianceName(b.al)}`;
  return `Next: ${to} · slot ${b.r + 1}${b.r - a.r === 1 ? " · back-to-back, break" : ""}`;
}

function drawReplays() {

    <div class="note">A slot is one match per side pair, played at the same time. No clock times: play them in this order.

      ${rpEdit && !done ? `<div class="btns edit"><button class="btn" data-a="up" data-m="${esc(it.id)}" aria-label="Earlier">↑</button><button class="btn" data-a="down" data-m="${esc(it.id)}" aria-label="Later">↓</button>

    const es = items.map((_, i) => i).filter(i => P[i].s === s).sort((a, b) => P[a].f - P[b].f);

  if (dups.length) {
    html += `<h3>Teams with more than one replay</h3>` + dups.map(([c, a]) => `<div class="rp-path" data-t="${esc(c)}"><div class="who">${flagHtml(c)}<span>${esc(teamName(c))}</span></div><ol>
      ${a.map((x, k) => `<li>Slot ${x.r + 1}: <b>F${x.f} ${allianceName(x.al)}</b> (replay of ${num(items[x.i])})${a[k + 1] ? `<br><span class="step">→ ${esc(moveText(x, a[k + 1]))}</span>` : ""}</li>`).join("")}</ol></div>`).join("");
  }
  box.innerHTML = html + modes;

/* ---------- Playoff line-ups ---------- */
const SIDES = ["red", "blue"];
// The tournament alliance on one side of a playoff match, found from its teams.
function sideAlliance(m, al) {
  if (m.type !== "playoff") return null;
  const a = ALLIANCE_OF.get(m[al][0]);
  return a && m[al].every(c => a.teams.includes(c)) ? a : null;
}
// Who sits out on a side: the site's line-up if it lists only three, else the volunteer's record.
function sittingOut(m, al) {
  if (m.siteOut && m.siteOut[al]) return m.siteOut[al];
  return (peek(m.id).x || []).find(c => m[al].includes(c)) || null;
}
// "out", "in", or "?" (not recorded). A side of three never has anyone sitting out.
function lineupOf(m, c) {
  const al = m.red.includes(c) ? "red" : "blue";
  if (m[al].length < 4) return "in";
  const o = sittingOut(m, al);
  return !o ? "?" : o === c ? "out" : "in";
}
function setSitOut(id, al, c) {
  snapshot();
  const m = BY_ID.get(id), x = mk(id);
  x.x = (x.x || []).filter(o => !m[al].includes(o));
  if (c) x.x.push(c);
  prune(id); save();
}
// An alliance's playoff (round robin) or final matches, in order.
const allianceMatches = (a, finals) => MATCHES.filter(m => m.type === "playoff" && isFinal(m) === !!finals && SIDES.some(al => sideAlliance(m, al) === a));
// T01 check before match m (a PLAYOFF MATCH, not a final): the alliance's teams not yet seen
// playing in its earlier playoff matches, whether m is its last one, and how many earlier
// line-ups are missing (then a team may have played without it being recorded).
function t01Before(m, a) {
  const ms = allianceMatches(a, false), i = ms.indexOf(m);
  if (i < 0) return null;
  const prior = ms.slice(0, i);
  const unseen = a.teams.filter(c => !prior.some(p => lineupOf(p, c) === "in"));
  return { unseen, last: i === ms.length - 1, missing: prior.filter(p => lineupOf(p, a.teams[0]) === "?").length, n: i };
}
// Per-team tag on an open playoff match: sits out, must play (alliance's last playoff match and
// it has not played yet), or has not played yet.
function lineupTag(m, c) {
  if (m.type !== "playoff") return null;
  const al = m.red.includes(c) ? "red" : "blue", a = sideAlliance(m, al);
  if (!a) return null;
  if (lineupOf(m, c) === "out") {
    const t = !isFinal(m) && statusOf(m) !== "done" && t01Before(m, a);
    return t && t.last && t.unseen.includes(c) ? { cls: "bad", text: "Sits out · has not played!" } : { cls: "out", text: "Sits out" };
  }
  if (isFinal(m) || statusOf(m) === "done") return null;
  const t = t01Before(m, a);
  if (!t || !t.unseen.includes(c) || (!t.n)) return null;
  if (t.missing === t.n) return null;  // no line-up recorded for this alliance yet: nothing to go on
  if (t.last) return { cls: "must", text: t.missing ? "Must play?" : "Must play" };
  return t.missing ? null : { cls: "new", text: "Not played yet" };
}
const allianceLabel = (m, al) => { const a = sideAlliance(m, al); return a ? `${allianceName(al)} · ${a.name}` : ""; };
const shortName = c => { const n = teamName(c); return n.length > 14 ? n.slice(0, 13) + "…" : n; };

// Sheet: who sits out, for both sides of a playoff match, with each team's playoff record.
function openLineup(id) {
  const m = BY_ID.get(id);
  const draw = () => {
    const side = al => {
      const a = sideAlliance(m, al), o = sittingOut(m, al), site = m.siteOut && m.siteOut[al];
      if (!a || m[al].length < 4) return "";
      const ms = allianceMatches(a, isFinal(m)), t = !isFinal(m) && t01Before(m, a);
      const rec = c => ms.filter(p => p !== m).map(p => {
        const l = lineupOf(p, c);
        return `<span class="lu-cell lu-${l === "?" ? "unk" : l}${p.t > m.t ? " later" : ""}" title="${esc(mLabel(p))}">${l === "in" ? "✓" : l === "out" ? "–" : "?"}</span>`;
      }).join("");
      const row = c => {
        const tag = lineupTag(m, c);
        return `<div class="lu-row${o === c ? " on" : ""}">${flagHtml(c)}<span class="lu-name">${esc(teamName(c))}${tag ? `<small class="lu ${tag.cls}">${tag.text}</small>` : ""}
            <small class="lu-rec">${ms.length > 1 ? `Other ${isFinal(m) ? "finals" : "playoff matches"}: ${rec(c)}` : ""}</small></span>
          ${site ? "" : `<button class="btn ${o === c ? "on" : ""}" data-a="out" data-al="${al}" data-t="${esc(c)}">${o === c ? "Sits out ✓" : "Sits out"}</button>`}</div>`;
      };
      const warn = t && t.last && t.unseen.length && t.missing === t.n
        ? `<p class="rp-msg">Last playoff match for ${esc(a.name)}, and no line-up was recorded for its earlier ones: check every team has played at least once (rule T01).</p>`
        : t && t.last && t.unseen.length
        ? `<p class="rp-msg${o && t.unseen.includes(o) ? " bad" : ""}">Last playoff match for ${esc(a.name)}: ${t.unseen.map(c => `<b>${esc(teamName(c))}</b>`).join(", ")} ${t.unseen.length > 1 ? "have" : "has"} not played yet${t.missing ? ` (or played in a match whose line-up was not recorded: ${t.missing})` : ""} and must play (rule T01).</p>` : "";
      return `<h3 style="color:var(--${al})">${allianceLabel(m, al)}</h3>${warn}${a.teams.map(row).join("")}
        ${site ? `<p class="note">Line-up as published on results.first.global.</p>` : `<div class="btns"><button class="btn ${o ? "" : "on"}" data-a="out" data-al="${al}" data-t="">Not decided</button></div>`}`;
    };
    return `${sheetTop()}<h2>Who sits out? · ${esc(mLabel(m))}</h2>
      <div class="btns" style="align-items:center">${fieldBadge(m)}<span class="time">${m.est ? "~" : ""}${hmH(m.t)}</span></div>
      <p class="note">Only three of an alliance's four teams play each match; the alliance decides which. Every team must play at least one playoff match (T01).
        ✓ played · – sat out · ? not recorded.</p>
      ${SIDES.map(side).join("")}
      <div class="btns" style="margin-top:14px"><button class="btn" data-a="po">🏆 All alliances</button></div>`;
  };
  openSheet(draw(), b => {
    if (b.dataset.a === "po") return openNested(openPlayoffs);
    if (b.dataset.a !== "out") return;
    setSitOut(id, b.dataset.al, b.dataset.t || null); render(false);
    const sheet = overlayRoot.querySelector(".sheet"), top = sheet.scrollTop;
    sheet.innerHTML = draw(); sheet.scrollTop = top;

// Alliance text, one per line: "1: Kazakhstan (KAZ), Aruba (ARU), …" or just "1 KAZ ARU BOL JAM".
// Teams can be given by code or by country name (as published).
function allianceText(al) {
  return Object.entries(al).map(([n, t]) => `${n}: ${t.map(c => c ? `${teamName(c)} (${c})` : "?").join(", ")}`).join("\n");
}
function parseAlliances(text) {
  const al = {}, bad = [];
  const find = tok => {
    tok = tok.trim(); if (!tok || tok === "?") return null;
    const code = (tok.match(/\(([A-Za-z]{3})\)/) || [])[1] || (/^[A-Za-z]{3}$/.test(tok) ? tok : null);
    if (code && TEAMS[code.toUpperCase()]) return code.toUpperCase();
    const q = norm(tok.replace(/\(.*?\)/g, ""));
    const hit = TEAM_INDEX.filter(t => t.n === q);
    const pre = hit.length ? hit : TEAM_INDEX.filter(t => t.n.startsWith(q));
    const any = pre.length ? pre : TEAM_INDEX.filter(t => t.n.includes(q));
    if (any.length === 1) return any[0].c;
    bad.push(tok); return null;
  };
  let next = 1;
  for (const line of String(text).split(/\n/)) {
    const mt = line.trim().match(/^(?:alliance|a)?\s*#?\s*([1-8])\s*[:.)\-–]?\s+(.*)$/i);
    const body = mt ? mt[2] : line.trim(), n = mt ? +mt[1] : next;
    if (!body) continue;
    const toks = /[,;\t]/.test(body) ? body.split(/[,;\t]/) : body.split(/\s+/);
    const row = toks.map(find).filter((c, i, a) => c !== null || toks[i].trim() === "?").slice(0, 4);
    while (row.length < 4) row.push(null);
    al[n] = row; next = n + 1;
  }
  return { al, bad };
}

    const hits = TEAM_INDEX.filter(t => words.every(w => t.n.split(" ").some(tw => tw.startsWith(w)) || t.cn.startsWith(w)))
      .concat(TEAM_INDEX.filter(t => t.n.includes(nq)))
      .filter((t, i, a) => a.findIndex(o => o.c === t.c) === i).slice(0, 10);
    if (!hits.length) { sr.innerHTML = `<p class="note" style="padding:10px">No team found.</p>`; return; }
    drawBox(sr, hits.map(({ c }) => teamCardHtml(c)).join(""), keep);
  };
  q.addEventListener("input", () => run());
  run(st);
  navOpened(() => { const s = boxState(sr), v = q.value; return () => openSearch(v, s); });
  if (!st) setTimeout(() => q.focus(), 30);
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, actions = [], ms = 5000) {
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${actions.map((a, i) => `<button data-i="${i}">${esc(a[0])}</button>`).join("")}</div>`;
  root.querySelectorAll("button").forEach(b => b.onclick = () => { root.innerHTML = ""; actions[b.dataset.i][1](); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => root.innerHTML = "", ms);
}

/* ---------- Schedule updates ---------- */
// The schedule is refreshed on the server from results.first.global (tools/fetch_fgc_data.py,
// run by hand or by the GitHub workflow) as soon as playoff matches and alliances are published.
// The phone checks for a newer data.js (event.rev differs) and offers to load it; marks are
// kept because match ids never change. The service worker serves data.js?fresh=… from the
// network and stores it, so a reload then shows the new schedule.
let updRev = null, updBusy = false;
async function checkUpdate(manual) {
  if (!location.protocol.startsWith("http") || updBusy) return;
  if (!manual && (document.visibilityState !== "visible" || navigator.onLine === false)) return;
  updBusy = true;
  try {
    const r = await fetch(`data.js?fresh=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const txt = await r.text();
    const rev = (txt.match(/"rev":\s*"([^"]+)"/) || [])[1];
    const src = (txt.match(/"source":\s*"([^"]+)"/) || [])[1] || "";
    if (rev && rev !== D.event.rev) {
      updRev = rev;
      const p = (txt.match(/"type":\s*"playoff"/g) || []).length, now = MATCHES.filter(m => m.type === "playoff").length;
      document.getElementById("updText").textContent = p !== now
        ? `New schedule: ${p} playoff match${p === 1 ? "" : "es"} (had ${now})` : "New schedule published";
      document.getElementById("updBar").classList.remove("hidden");
      fixStickyOffset();
      if (manual) toast("New schedule found", [["Load now", () => location.reload()]], 9000);
    } else if (manual) toast(`Schedule is up to date (${src.replace(/^results\.first\.global, /, "") || "no date"})`);
  } catch (e) {
    if (manual) toast("Could not check for updates (offline?)");
  } finally { updBusy = false; }
}
document.getElementById("updBtn").onclick = () => location.reload();
setInterval(() => checkUpdate(false), 3 * 60e3);
window.addEventListener("online", () => checkUpdate(false));

/* ---------- Wake lock ---------- */
let wakeLock = null;
async function applyWake() {
  try {
    if (S.ui.wake && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!S.ui.wake && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* not allowed (e.g. file://) */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { applyWake(); updateStatusLine(); placeNowLine(); checkUpdate(false); } });

/* ---------- Events ---------- */
document.getElementById("unitSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (S.ui.unit !== b.dataset.unit) { S.ui.unit = b.dataset.unit; S.ui.field = 0; save(); render(true); }
  else jumpToNext();
});
document.getElementById("fieldSub").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.ui.field = Number(b.dataset.field); save(); render(true);
});
document.getElementById("searchBtn").onclick = () => openSearch();
document.getElementById("menuBtn").onclick = openMenu;
document.getElementById("rpBtn").onclick = () => openReplays();
document.getElementById("nowBtn").onclick = () => jumpToNext(true);

listEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.m;
  if (b.dataset.act === "team") cycleTeam(id, b.dataset.t);
  else if (b.dataset.act === "sheet") openMatchSheet(id);
  else if (b.dataset.act === "stage") cycleStage(id);
  else if (b.dataset.act === "start") startMatch(id);
  else if (b.dataset.act === "replay") openReplays();
  else if (b.dataset.act === "lineup") openLineup(id);
  else if (b.dataset.act === "po") openPlayoffs();
  else if (b.dataset.act === "update") checkUpdate(true);
});
// Long-press: on a team opens its team page, elsewhere on a match its option sheet. Works in the
// list and in team pages. Timed from touch/pointer events because iOS never fires contextmenu;
// contextmenu still covers Android's own long-press and a right-click.
let lpTimer = null, lpAt = null, lpFired = false, lpEnd = null;
const LP_TARGET = '[data-act="team"], .match[data-m]';
// While a finger is held on a long-press target, nothing on the page can be selected: Android's own
// long-press would otherwise select the text of whatever opened under the finger (the team page).
const lpHold = on => document.body.classList.toggle("lp", on);
function longPress(el) {
  const t = el.closest('[data-act="team"]'), m = el.closest(".match[data-m]");
  const open = t ? () => openTeam(t.dataset.t) : () => openMatchSheet(m.dataset.m);
  lpFired = true; clearTimeout(lpTimer); lpTimer = null;
  if (navigator.vibrate) navigator.vibrate(15);
  if (overlayRoot.contains(el)) openNested(open); else open();
  const sel = window.getSelection && window.getSelection(); if (sel) sel.removeAllRanges();
}
document.addEventListener("pointerdown", e => {
  lpFired = false; clearTimeout(lpTimer); lpTimer = null; clearTimeout(lpEnd); lpHold(false);
  if (e.button !== 0 || !e.target.closest(LP_TARGET)) return;
  const el = e.target; lpAt = [e.clientX, e.clientY];
  if (e.pointerType !== "mouse") lpHold(true);
  lpTimer = setTimeout(() => longPress(el), 500);
});
document.addEventListener("pointermove", e => {
  if (lpTimer && Math.hypot(e.clientX - lpAt[0], e.clientY - lpAt[1]) > 10) { clearTimeout(lpTimer); lpTimer = null; }
});
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, () => { clearTimeout(lpTimer); lpTimer = null; }));
// Android cancels the pointer once its own long-press starts, so the hold ends when the finger lifts.
["pointerup", "touchend", "touchcancel"].forEach(t => document.addEventListener(t, () => { clearTimeout(lpEnd); lpEnd = setTimeout(() => lpHold(false), 300); }));
document.addEventListener("selectstart", e => { if (document.body.classList.contains("lp")) e.preventDefault(); });
document.addEventListener("contextmenu", e => {
  // During a held long-press the menu can target what just opened under the finger: block it too.
  if (!e.target.closest(LP_TARGET) && !document.body.classList.contains("lp")) return;
  e.preventDefault();
  if (!lpFired && e.target.closest(LP_TARGET)) longPress(e.target);
});
// The tap that ends a long-press must not also mark the team.
document.addEventListener("click", e => { if (lpFired) { lpFired = false; e.preventDefault(); e.stopPropagation(); } }, true);

window.addEventListener("resize", () => fixStickyOffset());
setInterval(() => { updateStatusLine(); placeNowLine(); }, 20e3);

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
render(true);
applyWake();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
setTimeout(() => checkUpdate(false), 4000);
try { if (sessionStorage.getItem("fgcq-reopen") === "playoffs") { sessionStorage.removeItem("fgcq-reopen"); openPlayoffs(); } } catch (e) {}
})();
</script>
