<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2330">
<meta name="mobile-web-app-capable" content="yes">
<title>FGC Queue Sheet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface2: #eceef2; --text: #14181f; --muted: #5b6474;
  --line: #d5d9e0; --head: #1b2330; --head-text: #ffffff;
  --red: #c62828; --red-bg: #fdecec; --blue: #1e5bc6; --blue-bg: #e9f0fd;
  --ok: #1b7f3b; --ok-bg: #d6f5df; --rep: #9a5b00; --rep-bg: #ffe9b8;
  --unk: #b0006d; --unk-bg: #ffd6ee; --queue: #b35c00; --queue-bg: #fff1dc;
  --deck: #0e7490; --deck-bg: #d5f6fb; --onf: #1b7f3b; --onf-text: #ffffff;
  --done: #4a5260; --late: #b3261e; --early: #1b7f3b;
  /* Field colours used at the event: 1 orange, 2 pink, 3 purple, 4 light blue, 5 green. */
  --brk: #00838f; --brk-bg: #e0f7fa;
  --f1: #f57c00; --f2: #ec4899; --f3: #7b2cbf; --f4: #4fc3f7; --f5: #2e9e44;
  --accent: #1e5bc6; --rp: #6d28d9; --rp-bg: #efe7ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1218; --surface: #181d26; --surface2: #222935; --text: #eef1f6; --muted: #9aa4b5;
    --line: #2d3542; --head: #0b0e13; --head-text: #eef1f6;
    --red: #ff6b6b; --red-bg: #3a1c20; --blue: #7aa7ff; --blue-bg: #1a2640;
    --ok: #5fd68a; --ok-bg: #173a24; --rep: #ffc04d; --rep-bg: #3d2f12;
    --unk: #ff6ec7; --unk-bg: #48163a; --queue: #ffb057; --queue-bg: #3a2a12;
    --deck: #5ee0f5; --deck-bg: #0e2f38; --onf: #5fd68a; --onf-text: #111;
    --done: #8a93a3; --late: #ff7b72; --early: #5fd68a;
    --accent: #7aa7ff; --brk: #4dd0e1; --brk-bg: #0f2f33; --rp: #c4a5ff; --rp-bg: #2a1f45;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Header ---------- */
header {
  position: sticky; top: 0; z-index: 20; background: var(--head); color: var(--head-text);
  padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.hrow { display: flex; align-items: center; gap: 6px; }
.hrow + .hrow { margin-top: 6px; }
.seg { display: flex; flex: 1; background: rgba(255,255,255,.1); border-radius: 10px; padding: 3px; gap: 3px; min-width: 0; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--head-text); border-radius: 8px;
  padding: 9px 4px; font-weight: 700; font-size: 15px; white-space: nowrap; min-width: 0;
}
.seg button.on { background: #fff; color: #111; }
.seg button.on[data-unit] { background-repeat: no-repeat; background-position: bottom; background-size: 100% 5px; }
.seg button.on[data-unit="12"] { background-image: linear-gradient(90deg, var(--f1) 50%, var(--f2) 50%); }
.seg button.on[data-unit="3"] { background-image: linear-gradient(var(--f3), var(--f3)); }
.seg button.on[data-unit="45"] { background-image: linear-gradient(90deg, var(--f4) 50%, var(--f5) 50%); }
.iconbtn {
  border: 0; background: rgba(255,255,255,.1); color: var(--head-text); border-radius: 10px;
  width: 42px; height: 42px; display: grid; place-items: center; flex: none;
}
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn { position: relative; }
.iconbtn .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #ffd36b; color: #111; font-size: 11px; font-weight: 900; line-height: 18px; text-align: center; }
.sub { display: flex; gap: 4px; }
.sub button {
  border: 1px solid rgba(255,255,255,.3); background: transparent; color: var(--head-text);
  border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px;
}
.sub button.on { background: rgba(255,255,255,.9); color: #111; border-color: transparent; }
.status-line { flex: 1; font-size: 13px; min-width: 0; text-align: right; opacity: .95; }
.status-line b { font-variant-numeric: tabular-nums; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; }

/* ---------- List ---------- */
main { padding: 0 max(6px, env(safe-area-inset-right)) 96px max(6px, env(safe-area-inset-left)); max-width: 1500px; margin: 0 auto; }
.dayhead {
  position: sticky; z-index: 5; background: var(--bg); color: var(--muted);
  font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
  padding: 10px 4px 6px; border-bottom: 1px solid var(--line);
}
.time .ampm { display: inline-block; font-size: .62em; font-weight: 700; margin-left: 2px; } /* inline-block: no strike-through on AM/PM */
/* Breaks detected from gaps in the schedule. Lunch: loud banner. Short break: still obvious, a step quieter. */
.brk { display: flex; align-items: center; gap: 10px; border-radius: 10px; margin: 10px 0; padding: 12px 14px; }
.brk .ico { font-size: 26px; line-height: 1; }
.brk .lbl { font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
.brk .sub { font-size: 13px; font-weight: 600; }
.brk.lunch { background: repeating-linear-gradient(135deg, #ffcf33 0 14px, #ffc107 14px 28px); color: #111; border: 3px solid #111; }
.brk.lunch .lbl { font-size: 22px; }
.brk.short { background: var(--brk-bg); color: var(--text); border: 2px dashed var(--brk); padding: 8px 12px; }
.brk.short .ico { font-size: 20px; }
.brk.short .lbl { font-size: 16px; color: var(--brk); }
.nowline { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12px; font-weight: 700; margin: 4px 0; }
.nowline::before, .nowline::after { content: ""; flex: 1; height: 2px; background: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

.match {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  margin: 6px 0; overflow: hidden; display: grid; gap: 4px; padding: 4px;
  grid-template-columns: 1fr 1fr; grid-template-areas: "meta meta" "red blue";
  scroll-margin-top: 140px;
}
.match.st-queue { --qc: var(--queue); border-color: var(--qc); box-shadow: 0 0 0 2px var(--qc) inset; }
.match.st-queue.q-deck { --qc: var(--deck); } .match.st-queue.q-field { --qc: var(--onf); }
.match.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: none; } }
.meta { grid-area: meta; display: flex; align-items: center; gap: 6px; padding: 2px 4px; min-width: 0; flex-wrap: wrap; }
.mid { display: flex; flex-direction: column; line-height: 1; min-width: 3.2em; background: none; border: 0; padding: 2px 0; text-align: left; }
.mtype { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.mnum { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mtype.t-practice { color: var(--muted); } .mtype.t-playoff { color: var(--unk); }
.fld { font-weight: 800; font-size: 14px; border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
.fld.f1 { background: var(--f1); color: #111; } .fld.f2 { background: var(--f2); color: #111; }
.fld.f3 { background: var(--f3); color: #fff; } .fld.f4 { background: var(--f4); color: #111; }
.fld.f5 { background: var(--f5); color: #fff; }
.time { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meta .spacer { flex: 1; }
.meta .row { display: flex; gap: 8px; align-items: center; }
.chip { border: 1.5px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip.st-queue { background: var(--queue-bg); border-color: var(--queue); color: var(--queue); }
/* Queue stage (tap the chip to advance): In queue → On deck → On field. */
.chip.q-deck { background: var(--deck-bg); border-color: var(--deck); color: var(--deck); }
.chip.q-field { background: var(--onf); border-color: var(--onf); color: var(--onf-text); }
.chip.st-done { background: var(--surface2); color: var(--done); }
.delta { font-weight: 800; font-variant-numeric: tabular-nums; }
.delta.late { color: var(--late); } .delta.early { color: var(--early); } .delta.zero { color: var(--accent); }
.delta.none { color: var(--muted); font-weight: 600; }
.chip.rp { background: var(--rp-bg); border-color: var(--rp); color: var(--rp); }
/* The header is always dark: use light variants there. */
.status-line .delta { white-space: nowrap; }
.status-line .delta.late { color: #ff8a80; } .status-line .delta.early { color: #69f0ae; } .status-line .delta.zero { color: #9cc0ff; }
.startbtn { border: 0; background: var(--head); color: #fff; border-radius: 8px; padding: 7px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .startbtn { background: #e8ecf3; color: #111; } }

.alliance { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.alliance.red { grid-area: red; } .alliance.blue { grid-area: blue; }
/* Alliance frame + label: the alliance colour stays visible whatever the teams are marked. */
.match .alliance { --al: var(--red); position: relative; padding: 16px 2px 2px; border: 2px solid var(--al); border-radius: 9px; }
.match .alliance.blue { --al: var(--blue); }
.match .alliance::before { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: var(--al); font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; line-height: 14px; padding-left: 6px; color: #fff; }
.match .alliance.red::before { content: "Red"; } .match .alliance.blue::before { content: "Blue"; }
/* Physical orientation: blue alliance on the left (menu setting). */
.al-swap .match { grid-template-areas: "meta meta" "blue red"; }
.team {
  position: relative; display: flex; align-items: center; gap: 6px; min-height: 44px; min-width: 0;
  border: 2px solid transparent; border-left: 5px solid; border-radius: 7px; padding: 3px 26px 3px 5px; text-align: left;
}
.red .team { background: var(--red-bg); border-left-color: var(--red); }
.blue .team { background: var(--blue-bg); border-left-color: var(--blue); }
/* Official flags are drawn on 5:3 canvases; never crop them. */
.flag { width: 40px; height: 24px; flex: none; object-fit: contain; object-position: left center; }
img.flag { filter: drop-shadow(0 0 .5px rgba(0,0,0,.6)); }
.flag.ph { background: var(--surface2); border-radius: 2px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: var(--muted); object-fit: initial; }
.tname { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; min-width: 0; }
.mk { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; display: none; place-items: center; font-size: 12px; font-weight: 900; color: #fff; }
.team.m-full { border-color: var(--ok); background: var(--ok-bg); }
.team.m-full .mk { display: grid; background: var(--ok); }
.team.m-rep { border-color: var(--rep); border-style: dashed; background: var(--rep-bg); border-left-style: solid; }
.team.m-rep .mk { display: grid; background: var(--rep); }
.team.m-unk { border-color: var(--unk); background: repeating-linear-gradient(135deg, var(--unk-bg) 0 8px, transparent 8px 14px), var(--unk-bg); }
.team.m-unk .mk { display: grid; background: var(--unk); }
.team.m-unk .tname { font-weight: 800; }
@media (prefers-color-scheme: dark) { .mk { color: #111; } .match .alliance::before { color: #111; } }
/* The left stripe always shows the alliance, even on marked teams. */
.red .team.team { border-left-color: var(--red); } .blue .team.team { border-left-color: var(--blue); }

/* Played / crossed-out */
/* Played matches: clearly inactive at a glance (grey, desaturated, faded) but still readable for look-ups. */
.match.st-done { background: var(--surface2); border-color: var(--line); box-shadow: none; }
.match.st-done .team.team { background: transparent; border-color: transparent; border-left-color: var(--line); }
.match.st-done .alliance { --al: var(--line); }
.match.st-done .alliance::before { color: var(--muted); }
.match.st-done .team, .match.st-done .mid, .match.st-done .time, .match.st-done .fld { opacity: .45; filter: grayscale(1); }
.match.st-done .mnum, .match.st-done .time { text-decoration: line-through; text-decoration-thickness: 2px; }

/* Medium: meta column on the left, alliances stacked */
@media (min-width: 560px) {
  .match { grid-template-columns: 8.2rem 1fr 1fr; grid-template-areas: "meta red blue"; }
  .al-swap .match { grid-template-areas: "meta blue red"; }
  .meta { flex-direction: column; align-items: flex-start; justify-content: center; gap: 5px; flex-wrap: nowrap; }
  .meta .spacer { display: none; }
  .meta .row { gap: 6px; flex-wrap: wrap; }
}
/* Wide: one row per match */
@media (min-width: 800px) {
  .match { grid-template-columns: 7.6rem 1fr 1fr; }
  .alliance { flex-direction: row; }
  .alliance .team { flex: 1 1 0; flex-direction: column; align-items: flex-start; padding: 4px 22px 4px 6px; }
  .tname { font-size: 13px; }
}
@media (min-width: 1150px) {
  .alliance .team { flex-direction: row; align-items: center; }
  .tname { font-size: 14px; }
}

/* Short screens (landscape phones): compact header */
@media (max-height: 520px) {
  header { padding-top: 4px; padding-bottom: 4px; }
  .hrow + .hrow { margin-top: 3px; }
  .seg button { padding: 5px 4px; }
  .iconbtn { width: 36px; height: 34px; }
  .sub button { padding: 2px 10px; }
  .dayhead { padding: 4px 4px 3px; }
  .team { min-height: 38px; }
  .fab { padding: 9px 14px; }
}

/* ---------- Sheets / overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); color: var(--text);
  border-radius: 16px 16px 0 0; max-height: 88vh; overflow: auto; padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto; box-shadow: 0 -6px 20px rgba(0,0,0,.3);
}
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.sheet h3, .rpl h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sheet .close { position: sticky; top: 0; float: right; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 10px 14px; font-weight: 700; min-height: 44px; }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary { background: var(--head); color: #fff; border-color: var(--head); }
.btn.danger { color: var(--late); border-color: var(--late); }
.toggle .btns { flex-wrap: nowrap; flex: none; } .toggle .btns .btn { min-width: 64px; }
.btn.sw-red.on { background: var(--red); border-color: var(--red); } .btn.sw-blue.on { background: var(--blue); border-color: var(--blue); }
@media (prefers-color-scheme: dark) { .btn.on { color: #111; } .btn.primary { background: #e8ecf3; color: #111; } }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .val { min-width: 4.5em; text-align: center; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.trow { display: grid; grid-template-columns: 1fr; gap: 4px; margin-bottom: 8px; }
.trow .who .flag { width: 50px; height: 30px; }
.trow .who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.trow .btns .btn { flex: 1; padding: 8px 6px; font-size: 13px; }
.legend { display: grid; gap: 6px; }
.legend .team { pointer-events: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; font-weight: 600; }
.toggle input { width: 22px; height: 22px; }
.note { color: var(--muted); font-size: 13px; }

/* Search */
.search {
  position: fixed; inset: 0; z-index: 45; background: var(--bg); display: flex; flex-direction: column;
}
.search .bar { display: flex; gap: 6px; padding: 8px; background: var(--head); }
.search input { flex: 1; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 0; min-width: 0; }
.search .results { overflow: auto; padding: 8px 8px 40px; }
.sres { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
.sres .who { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
.sres .who .flag { width: 60px; height: 36px; }
.sres .next { margin: 8px 0; padding: 10px; border-radius: 10px; background: var(--surface2); font-size: 16px; }
.sres .next b { font-size: 18px; }
.sres .dir { font-size: 20px; font-weight: 900; }
.slist { display: grid; gap: 3px; }
.sitem { display: grid; grid-template-columns: 5.2em 3.2em 5em 1fr; align-items: center; gap: 6px; padding: 6px; border-radius: 8px; background: var(--surface2); border: 0; text-align: left; font-size: 14px; }
.sitem.past { opacity: .5; }
.sitem .al-red { color: var(--red); font-weight: 800; } .sitem .al-blue { color: var(--blue); font-weight: 800; }

/* Replay planner (full screen, same frame as search) */
.rpl .bar .btn { min-height: 0; background: #fff; color: #111; border: 0; }
.rpl .results { padding-top: 4px; width: 100%; max-width: 1100px; margin: 0 auto; }
.rp-msg { margin: 8px 2px; padding: 8px 10px; border-radius: 8px; background: var(--surface2); font-weight: 600; font-size: 14px; }
.rp-msg.bad { background: var(--red-bg); color: var(--red); }
.rp-sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; font-size: 15px; }
.rp-sum .big { font-size: 18px; font-weight: 800; }
.rp-warn { margin: 6px 0 0; padding: 0 0 0 18px; font-size: 14px; }
.rp-warn li { margin: 3px 0; }
.rp-warn .bad { color: var(--late); font-weight: 800; }
.slothead { display: flex; align-items: baseline; gap: 8px; margin: 14px 2px 2px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.slothead .n { font-size: 17px; color: var(--text); }
.rmatch .fld { font-size: 18px; padding: 4px 9px; }
.rmatch .was { font-size: 12px; color: var(--muted); }
.rmatch .mid { cursor: default; }
.rmatch .btn { min-height: 38px; padding: 6px 10px; font-size: 13px; }
.rmatch .meta .row { flex-wrap: wrap; }
.rmatch .edit { grid-column: 1 / -1; padding: 2px; }
.rmatch .edit .btn { min-width: 42px; }
.rteam .go { display: block; font-size: 12px; font-weight: 700; color: var(--rp); margin-top: 1px; }
.rteam.dup { border-color: var(--rp); }
.rteam.dup .mk { display: grid; width: auto; min-width: 26px; padding: 0 4px; border-radius: 10px; background: var(--rp); font-size: 11px; }
.rteam.clash { border-color: var(--late); border-style: solid; box-shadow: 0 0 0 2px var(--late) inset; }
.rp-path { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
.rp-path .who { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.rp-path ol { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.rp-path li { margin: 2px 0; }
.rp-path .step { color: var(--rp); font-weight: 700; }
.sres .next.rpn { background: var(--rp-bg); }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60;
  background: #222; color: #fff; border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; max-width: calc(100vw - 20px); box-shadow: 0 4px 16px rgba(0,0,0,.4); font-weight: 600;
}
.toast button { border: 0; background: rgba(255,255,255,.15); color: #ffd36b; border-radius: 8px; padding: 8px 10px; font-weight: 800; }
.fab {
  position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30;
  border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; padding: 13px 18px; box-shadow: 0 4px 12px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) { .fab { color: #111; } }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="seg" id="unitSeg">
      <button data-unit="12">F1·2</button>
      <button data-unit="3">F3</button>
      <button data-unit="45">F4·5</button>
      <button data-unit="all">All</button>
    </div>
    <button class="iconbtn" id="searchBtn" aria-label="Search team">

<script src="data.js"></script>
<script>
"use strict";
(function () {
const D = window.FGC_DATA;
if (!D) { document.body.innerHTML = '<p style="padding:20px">data.js is missing or failed to load.</p>'; return; }
const TZ = D.event.tz || "UTC";
const TEAMS = D.teams || {};
const UNITS = {
  "12": { label: "Fields 1 & 2", fields: [1, 2] },
  "3":  { label: "Field 3 (center)", fields: [3] },
  "45": { label: "Fields 4 & 5", fields: [4, 5] },
  "all": { label: "All fields", fields: [1, 2, 3, 4, 5] },
};
const TYPE_LABEL = { practice: "Practice", ranking: "Ranking", playoff: "Playoff" };
const unitOf = f => f <= 2 ? "12" : f === 3 ? "3" : "45";
const MARK_CYCLE = [null, "full", "rep", "unk"];
const MARK_INFO = {
  full: { glyph: "✓", label: "Full team + robot" },
  rep: { glyph: "R", label: "Rep only (no robot)" },
  unk: { glyph: "?", label: "Not heard from / unknown" },
};

const MATCHES = D.matches.map(m => ({
  ...m, id: m.id || `${m.type}-${m.number}-F${m.field}`, t: Date.parse(m.time), unit: unitOf(m.field),
})).sort((a, b) => a.t - b.t || a.field - b.field);
const BY_ID = new Map(MATCHES.map(m => [m.id, m]));

// Replays are stored next to the marks as S.r: flagged match ids, the planned order
// (plan: [{id, s: slot, f: field}]), which replays are done, and the field mode.
const REPLAY_MODES = [["auto", "Auto"], ["home", "Own pair"], ["spread", "Both pairs"], ["12", "F1·2 only"], ["45", "F4·5 only"]];
function normReplays(r) {
  r = r && typeof r === "object" ? r : {};
  const ids = Array.isArray(r.ids) ? [...new Set(r.ids.filter(id => BY_ID.has(id)))] : [];
  return {
    ids,
    plan: Array.isArray(r.plan) ? r.plan.filter(p => p && ids.includes(p.id) && Number.isInteger(p.s) && [1, 2, 4, 5].includes(p.f)) : [],
    done: Object.fromEntries(Object.keys(r.done || {}).filter(id => ids.includes(id)).map(id => [id, 1])),
    mode: REPLAY_MODES.some(([k]) => k === r.mode) ? r.mode : "auto",
    manual: !!r.manual,
  };
}

/* ---------- Persistence ---------- */
const KEY = "fgcq:" + D.event.id;
const DEFAULT_UI = { unit: "12", field: 0, hideDone: false, type: "all", wake: false, h24: false, timing: false, swap: false };
let S = { v: 1, m: {}, ui: { ...DEFAULT_UI }, r: normReplays() };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); if (p && p.m) S = { v: 1, m: p.m, ui: { ...DEFAULT_UI, ...(p.ui || {}) }, r: normReplays(p.r) }; }
} catch (e) { console.error(e); }
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; }
  catch (e) { if (!saveFailed) toast("⚠ Could not save to this device!"); saveFailed = true; }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
// Another tab of the same page changed the data: pick it up.
window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { try { const p = JSON.parse(e.newValue); S.m = p.m || {}; S.r = normReplays(p.r); render(false); } catch (_) {} } });

const mk = id => S.m[id] || (S.m[id] = { t: {} });
const peek = id => S.m[id] || { t: {} };
function prune(id) { const x = S.m[id]; if (x && !x.s && x.d == null && !Object.keys(x.t || {}).length) delete S.m[id]; }
function statusOf(m) {
  const x = peek(m.id);
  if (x.s === "done" || x.s === "queue" || x.s === "idle") return x.s;  // the volunteer's mark always wins
  if (m.played) return "done";  // already played according to results.first.global
  return Object.values(x.t || {}).some(v => v === "full" || v === "rep") ? "queue" : "idle";
}
// Where a queuing match is: S.m[id].q ("deck" | "field"), absent = in queue. Independent of status.
const STAGES = ["", "deck", "field"];
const STAGE_LABEL = { "": "In queue", deck: "On deck", field: "On field" };
const stageOf = id => STAGES.includes(peek(id).q) ? peek(id).q || "" : "";

let undoSnap = null;
function snapshot() { undoSnap = JSON.stringify({ m: S.m, r: S.r }); }
function undo() {
  if (!undoSnap) return;
  const u = JSON.parse(undoSnap); undoSnap = null;
  S.m = u.m; S.r = normReplays(u.r);
  save(); if (document.querySelector(".rpl")) drawReplays(); render(false); toast("Undone");
}

/* ---------- Formatting ---------- */
// Times are always shown in the event's local time zone; 12-hour (AM/PM) by default.
let fTime;
const setClock = () => { fTime = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", hourCycle: S.ui.h24 ? "h23" : "h12" }); };
setClock();
const fDay = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
const fDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const hm = t => fTime.format(t);
// Same, with a smaller AM/PM for the big time displays.
const hmH = t => fTime.formatToParts(t).map(p => p.type === "dayPeriod" ? `<small class="ampm">${p.value}</small>` : p.type === "literal" && p.value.trim() === "" ? "" : esc(p.value)).join("");
// Start delta: 0 is a recorded "on time" start, null means nothing recorded (shown differently).
const fmtDelta = d => d == null ? "" : d === 0 ? "On time" : (d > 0 ? "+" : "−") + Math.abs(d);
const fmtDeltaMin = d => d == null ? "" : d === 0 ? "on time" : fmtDelta(d) + " min";
// Minutes between the scheduled minute and the current clock minute: starting any time during
// the scheduled minute (e.g. 11:15:00–11:15:59 for an 11:15 match) counts as on time.
const clockDelta = m => Math.floor(Date.now() / 60e3) - Math.floor(m.t / 60e3);
const deltaCls = d => d == null ? "" : d > 0 ? "late" : d < 0 ? "early" : "zero";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Country name exactly as published by FIRST Global (minus the generic "Team " prefix).
const teamName = c => (TEAMS[c] && (TEAMS[c].country || TEAMS[c].name)) || c;
function flagHtml(c, cls = "flag") {
  const t = TEAMS[c];
  if (t && t.flag) return `<img class="${cls}" src="${esc(t.flag)}" alt="" loading="lazy" decoding="async">`;
  return `<span class="${cls} ph">${esc(c).slice(0, 4)}</span>`;
}
const fieldBadge = m => `<span class="fld f${m.field}">F${m.field}</span>`;

/* ---------- Breaks ---------- */
// Found from the schedule itself: per day, gaps between event-wide match slots that are much
// longer than the normal cycle. About an hour or more = lunch; anything shorter = short break.
const BREAKS = (() => {
  const byDay = new Map();
  for (const m of MATCHES) {
    const k = fDayKey.format(m.t);
    if (!byDay.has(k)) byDay.set(k, new Set());
    byDay.get(k).add(m.t);
  }
  const out = [];
  for (const set of byDay.values()) {
    const ts = [...set].sort((a, b) => a - b);
    const gaps = ts.slice(1).map((t, i) => t - ts[i]);
    if (!gaps.length) continue;
    const cycle = [...gaps].sort((a, b) => a - b)[Math.floor(gaps.length / 2)];
    gaps.forEach((g, i) => {
      // from = last match start before the break, to = first match start after it.
      if (g >= cycle + 6 * 60e3) out.push({ from: ts[i], to: ts[i + 1], lunch: g - cycle >= 40 * 60e3 });
    });
  }
  return out;
})();

/* ---------- Replay planning ---------- */
// Replays never use Field 3; they go to the side-field pairs. Each pair plays one match at a
// time and the two pairs play side by side, so a plan is a list of slots holding at most one
// match per pair. Only the order matters: no clock, no cycle time. A team in two consecutive
// slots is "back-to-back" and forces a break before the second slot.
const pairOf = f => f <= 2 ? "12" : "45";
const allianceName = al => al === "red" ? "Red" : "Blue";
// Plan costs. Hard: one match per pair per slot, a team in two matches at once. Then breaks,
// then number of slots, then walking. "away" = played on the other pair than the original one.
const RW = { pair: 1e6, clash: 1e5, brk: 1000, b2b: 100, slot: 100, away: 60, same: 40, tight: 15, walk: 12, side: 3, moved: 2 };

// Which fields each pending replay may use. Auto: every side pair plays its own replays (F3's
// go to whichever pair is lighter) while no pair has more than two; beyond that, spread them.
function replayFields(pending, mode) {
  let use = mode;
  if (mode === "auto") {
    const n = { "12": 0, "45": 0 }; let f3 = 0;
    for (const m of pending) if (m.field === 3) f3++; else n[pairOf(m.field)]++;
    while (f3-- > 0) n[n["12"] <= n["45"] ? "12" : "45"]++;
    use = Math.max(n["12"], n["45"]) <= 2 ? "home" : "spread";
  }
  const fn = m => use === "12" ? [1, 2] : use === "45" ? [4, 5]
    : use === "home" && m.field !== 3 ? (pairOf(m.field) === "12" ? [1, 2] : [4, 5]) : [1, 2, 4, 5];
  return { use, fn };
}
function replayItem(id) {
  const m = BY_ID.get(id);
  return { id, m, t: m.t, orig: m.field, home: m.field === 3 ? null : pairOf(m.field),
    teams: [...m.red.map(c => [c, "red"]), ...m.blue.map(c => [c, "blue"])] };
}

// Scores a plan (P[i] = {s, f} for items[i]; null = not placed yet) and reports what it found.
function scorePlan(items, P) {
  const order = [...new Set(P.filter(Boolean).map(p => p.s))].sort((a, b) => a - b);
  const ri = new Map(order.map((s, i) => [s, i]));
  let cost = order.length * RW.slot;
  const pairUse = new Set(), pairSeq = { "12": [], "45": [] }, byTeam = new Map();
  items.forEach((it, i) => {
    const p = P[i]; if (!p) return;
    const r = ri.get(p.s), pr = pairOf(p.f);
    if (pairUse.has(r + pr)) cost += RW.pair; else pairUse.add(r + pr);
    pairSeq[pr].push([r, p.f]);
    if (it.home && it.home !== pr) cost += RW.away;
    if (p.f !== it.orig) cost += RW.moved;
    for (const [c, al] of it.teams) {
      let a = byTeam.get(c); if (!a) byTeam.set(c, a = []);
      a.push({ r, f: p.f, al, i });
    }
  });
  // A pair playing the same field twice in a row has to wait for that field to be reset.
  for (const q of Object.values(pairSeq)) {
    q.sort((a, b) => a[0] - b[0]);
    for (let j = 1; j < q.length; j++) if (q[j][0] === q[j - 1][0] + 1 && q[j][1] === q[j - 1][1]) cost += RW.same;
  }
  const brk = order.map(() => null), clash = [];
  for (const [c, a] of byTeam) {
    if (a.length < 2) continue;
    a.sort((x, y) => x.r - y.r || x.i - y.i);
    for (let j = 1; j < a.length; j++) {
      const g = a[j].r - a[j - 1].r;
      if (g === 0) { cost += RW.clash; clash.push({ c, r: a[j].r, i: a[j].i, j: a[j - 1].i }); }
      else if (g === 1) { cost += RW.b2b; (brk[a[j].r] = brk[a[j].r] || []).push(c); }
      else if (g === 2) cost += RW.tight;
      cost += Math.abs(a[j].f - a[j - 1].f) * RW.walk + (a[j].f === a[j - 1].f && a[j].al !== a[j - 1].al ? RW.side : 0);
    }
  }
  cost += brk.filter(Boolean).length * RW.brk;
  return { cost, order, brk, clash, byTeam };
}

function seededRandom(str) {
  let a = 2166136261;
  for (const ch of str) a = Math.imul(a ^ ch.charCodeAt(0), 16777619);
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Same cost as scorePlan, without the report and built for speed: the optimizer calls it tens
// of thousands of times. S[i], F[i] = slot and field of items[i]; act = the items placed so far.
function planCoster(items) {
  const N = items.length, codes = new Map(), start = new Int32Array(N + 1), tm = [], al = [];
  items.forEach((it, i) => {
    start[i] = tm.length;
    for (const [c, a] of it.teams) { if (!codes.has(c)) codes.set(c, codes.size); tm.push(codes.get(c)); al.push(a === "red" ? 0 : 1); }
  });
  start[N] = tm.length;
  const home = items.map(it => it.home === "12" ? 0 : it.home === "45" ? 1 : -1), orig = items.map(it => it.orig);
  const keys = new Int32Array(tm.length);
  let rank = new Int32Array(0), occ = new Int32Array(0), brk = new Uint8Array(0);
  return (S, F, act) => {
    let lo = Infinity, hi = -Infinity, k = 0;
    for (const i of act) { if (S[i] < lo) lo = S[i]; if (S[i] > hi) hi = S[i]; }
    const span = hi - lo + 1;
    if (rank.length < span) rank = new Int32Array(span * 2);
    rank.fill(0, 0, span);
    for (const i of act) rank[S[i] - lo] = 1;
    let n = 0;
    for (let s = 0; s < span; s++) if (rank[s]) rank[s] = ++n;  // slot number, from 1
    if (occ.length < 2 * n + 4) { occ = new Int32Array(4 * n + 8); brk = new Uint8Array(2 * n + 4); }
    occ.fill(0, 0, 2 * n + 4); brk.fill(0, 0, n + 2);
    let cost = n * RW.slot;
    for (const i of act) {
      const r = rank[S[i] - lo], p = F[i] <= 2 ? 0 : 1;
      if (occ[r * 2 + p]) cost += RW.pair; else occ[r * 2 + p] = F[i];
      if (home[i] >= 0 && home[i] !== p) cost += RW.away;
      if (F[i] !== orig[i]) cost += RW.moved;
      for (let j = start[i]; j < start[i + 1]; j++) keys[k++] = tm[j] * 65536 + r * 32 + F[i] * 2 + al[j];
    }
    for (let r = 1; r < n; r++) for (let p = 0; p < 2; p++) if (occ[r * 2 + p] && occ[r * 2 + p] === occ[r * 2 + 2 + p]) cost += RW.same;
    const ks = keys.subarray(0, k).sort();
    for (let j = 1; j < k; j++) {
      const a = ks[j - 1], b = ks[j];
      if (a >> 16 !== b >> 16) continue;
      const rb = (b >> 5) & 2047, g = rb - ((a >> 5) & 2047), fa = (a >> 1) & 15, fb = (b >> 1) & 15;
      if (g === 0) cost += RW.clash;
      else if (g === 1) { cost += RW.b2b; if (!brk[rb]) { brk[rb] = 1; cost += RW.brk; } }
      else if (g === 2) cost += RW.tight;
      cost += Math.abs(fb - fa) * RW.walk + (fa === fb && (a & 1) !== (b & 1) ? RW.side : 0);
    }
    return cost;
  };
}
// items[i].fix = {s, f} keeps a match where it is (played replays, manual edits); items[i].done
// also means nothing new may be placed in or before its slot. Free matches are placed greedily,
// then improved by simulated annealing (a few runs, best kept). Deterministic for the same input.
function optimizeReplays(items, seed) {
  const N = items.length, rnd = seededRandom(seed), cost = planCoster(items);
  const S = new Int32Array(N), F = new Int32Array(N);
  const act = [], free = [];
  items.forEach((it, i) => { if (it.fix) { S[i] = it.fix.s; F[i] = it.fix.f; act.push(i); } else free.push(i); });
  free.sort((a, b) => items[a].t - items[b].t);
  // Re-numbers slots in order: step 2 leaves the odd numbers free for inserting a new slot.
  const renumber = step => {
    const ix = new Map([...new Set(act.map(i => S[i]))].sort((a, b) => a - b).map((s, j) => [s, j * step]));
    for (const i of act) S[i] = ix.get(S[i]);
  };
  const range = () => {
    if (!act.length) return [0, 0];
    let lo = Infinity, hi = -Infinity, fl = -Infinity;
    for (const i of act) { lo = Math.min(lo, S[i]); hi = Math.max(hi, S[i]); if (items[i].done) fl = Math.max(fl, S[i]); }
    return [Math.max(fl + 1, lo - 1), hi + 1];
  };
  renumber(2);
  for (const i of free) {
    const [lo, hi] = range();
    act.push(i);
    let best = null;
    for (let s = lo; s <= Math.max(lo, hi); s++) for (const f of items[i].allowed) {
      S[i] = s; F[i] = f;
      const c = cost(S, F, act);
      if (!best || c < best.c) best = { s, f, c };
    }
    S[i] = best.s; F[i] = best.f;
    renumber(2);
  }
  const S0 = S.slice(), F0 = F.slice();
  let best = cost(S, F, act), bestS = S.slice(), bestF = F.slice();
  const iters = free.length > 1 ? Math.min(15000, 1500 * free.length) : 0;
  for (let run = 0; run < 2 && iters; run++) {
    S.set(S0); F.set(F0);
    let cur = cost(S, F, act), T = 80, lo = 0, hi = 0;
    const cool = Math.pow(1 / 80, 1 / iters);
    for (let k = 0; k < iters; k++, T *= cool) {
      if (k % 40 === 0) { renumber(2); [lo, hi] = range(); }
      const i = free[Math.floor(rnd() * free.length)], si = S[i], fi = F[i];
      let j = -1, sj = 0, fj = 0;
      if (rnd() < 0.3) {  // swap two matches' slots (and fields, when both may use them)
        j = free[Math.floor(rnd() * free.length)];
        if (j === i) continue;
        sj = S[j]; fj = F[j];
        S[i] = sj; S[j] = si;
        if (items[i].allowed.includes(fj) && items[j].allowed.includes(fi)) { F[i] = fj; F[j] = fi; }
      } else {            // move one match to another (or a new) slot, maybe another field
        S[i] = lo + Math.floor(rnd() * (hi - lo + 1));
        if (rnd() < 0.6) F[i] = items[i].allowed[Math.floor(rnd() * items[i].allowed.length)];
      }
      const c = cost(S, F, act);
      if (c <= cur || rnd() < Math.exp((cur - c) / T)) {
        cur = c;
        if (c < best) { best = c; bestS = S.slice(); bestF = F.slice(); }
      } else { S[i] = si; F[i] = fi; if (j >= 0) { S[j] = sj; F[j] = fj; } }
    }
  }
  S.set(bestS); F.set(bestF); renumber(1);
  return items.map((_, i) => ({ s: S[i], f: F[i] }));
}
// Re-numbers a stored plan's slots to 0, 1, 2… (after hand edits).
function renumber(P) {
  const ix = new Map([...new Set(P.map(p => p.s))].sort((a, b) => a - b).map((s, i) => [s, i]));
  P.forEach(p => { p.s = ix.get(p.s); });
}

// Brings S.r.plan in line with the flagged list. Played replays never move. Other matches are
// re-planned, unless the plan was edited by hand: then only newly added matches are placed.
function syncReplays(reopt) {
  const R = S.r;
  const have = new Map(R.plan.filter(p => R.ids.includes(p.id)).map(p => [p.id, p]));
  if (!reopt && have.size === R.ids.length && R.plan.length === R.ids.length) return;
  const { fn } = replayFields(R.ids.filter(id => !R.done[id]).map(id => BY_ID.get(id)), R.mode);
  const items = R.ids.map(id => {
    const it = replayItem(id), p = have.get(id);
    it.allowed = fn(it.m);
    it.done = !!(R.done[id] && p);
    it.fix = p && (it.done || (R.manual && !reopt)) ? { s: p.s, f: p.f } : null;
    return it;
  });
  const P = optimizeReplays(items, R.ids.join() + R.mode);
  R.plan = items.map((it, i) => ({ id: it.id, s: P[i].s, f: P[i].f }));
  if (reopt || !R.plan.some(p => !R.done[p.id])) R.manual = false;
}
const replayEntry = id => S.r.ids.includes(id) ? S.r.plan.find(p => p.id === id) || {} : null;

/* ---------- View selection ---------- */
function viewMatches() {
  const u = UNITS[S.ui.unit] || UNITS["12"];
  return MATCHES.filter(m => u.fields.includes(m.field)
    && (!S.ui.field || m.field === S.ui.field)
    && (S.ui.type === "all" || m.type === S.ui.type));
}

/* ---------- Rendering ---------- */
const listEl = document.getElementById("list");

function teamHtml(m, c) {
  const v = peek(m.id).t[c];
  const info = v && MARK_INFO[v];
  return `<button class="team${v ? " m-" + v : ""}" data-act="team" data-m="${esc(m.id)}" data-t="${esc(c)}"
     aria-label="${esc(teamName(c))}${info ? ", " + info.label : ""}">${flagHtml(c)}<span class="tname">${esc(teamName(c))}</span><span class="mk">${info ? info.glyph : ""}</span></button>`;
}
function matchHtml(m) {
  const st = statusOf(m), x = peek(m.id);
  const chip = st === "done"
    ? `<button class="chip st-done" data-act="sheet" data-m="${esc(m.id)}">Played${S.ui.timing && x.d != null ? ` · <span class="delta ${deltaCls(x.d)}">${fmtDelta(x.d)}</span>` : ""}</button>`
    : st === "queue"
      ? `<button class="chip st-queue${stageOf(m.id) ? " q-" + stageOf(m.id) : ""}" data-act="stage" data-m="${esc(m.id)}" aria-label="${STAGE_LABEL[stageOf(m.id)]}, tap to advance">${STAGE_LABEL[stageOf(m.id)]}</button>`
      : "";
  const start = st === "done" ? "" : `<button class="startbtn" data-act="start" data-m="${esc(m.id)}">${S.ui.timing ? "Start ▶" : "Mark done ✓"}</button>`;
  const rp = replayEntry(m.id);
  const rpChip = !rp ? "" : `<button class="chip rp" data-act="replay">↻ ${S.r.done[m.id] ? "Replayed" : rp.f ? `Replay · S${rp.s + 1} F${rp.f}` : "Replay"}</button>`;
  return `<div class="match st-${st}${st === "queue" && stageOf(m.id) ? " q-" + stageOf(m.id) : ""}" id="m-${esc(m.id)}" data-m="${esc(m.id)}">
    <div class="meta">
      <div class="row"><button class="mid" data-act="sheet" data-m="${esc(m.id)}"><span class="mtype t-${m.type}">${TYPE_LABEL[m.type] || esc(m.type)}</span><span class="mnum">${esc(m.label || m.number)}</span></button>${fieldBadge(m)}<span class="time">${hmH(m.t)}</span></div>
      <span class="spacer"></span>
      <div class="row">${rpChip}${chip}${start}</div>
    </div>
    <div class="alliance red">${m.red.map(c => teamHtml(m, c)).join("")}</div>
    <div class="alliance blue">${m.blue.map(c => teamHtml(m, c)).join("")}</div>
  </div>`;
}

function render(scroll) {
  document.body.classList.toggle("al-swap", !!S.ui.swap);
  // Header controls
  document.querySelectorAll("#unitSeg button").forEach(b => b.classList.toggle("on", b.dataset.unit === S.ui.unit));
  const u = UNITS[S.ui.unit];
  const sub = document.getElementById("fieldSub");
  sub.innerHTML = u.fields.length > 1
    ? [0, ...u.fields].map(f => `<button data-field="${f}" class="${S.ui.field === f ? "on" : ""}">${f ? "F" + f : "Both"}</button>`).join("")
    : "";
  if (u.fields.length > 1 && S.ui.unit === "all") sub.innerHTML = [0, ...u.fields].map(f => `<button data-field="${f}" class="${S.ui.field === f ? "on" : ""}">${f || "All"}</button>`).join("");

  const ms = viewMatches();
  let html = "", lastDay = "", lastType = "", prevT = null;
  for (const m of ms) {
    for (const b of BREAKS) if (prevT != null && prevT <= b.from && b.to <= m.t) html += breakHtml(b);
    prevT = m.t;
    if (S.ui.hideDone && statusOf(m) === "done") continue;
    const dk = fDayKey.format(m.t);
    if (dk !== lastDay || m.type !== lastType) {
      html += `<div class="dayhead">${fDay.format(m.t)} · ${TYPE_LABEL[m.type] || esc(m.type)}</div>`;
      lastDay = dk; lastType = m.type;
    }
    html += matchHtml(m);
  }
  listEl.innerHTML = html || `<div class="empty">No matches in this view.</div>`;
  updateReplayBadge();
  fixStickyOffset();
  placeNowLine();
  updateStatusLine();
  if (scroll) jumpToNext(false);
}

function breakHtml(b) {
  return b.lunch
    ? `<div class="brk lunch" role="separator"><span class="ico">🍴</span><div><div class="lbl">Lunch break</div><div class="sub">Last match ${hm(b.from)} · resumes <b>${hm(b.to)}</b></div></div></div>`
    : `<div class="brk short" role="separator"><span class="ico">☕</span><div><div class="lbl">Break</div><div class="sub">Last match ${hm(b.from)} · resumes <b>${hm(b.to)}</b></div></div></div>`;
}

function rerenderMatch(id) {
  const el = document.getElementById("m-" + id);
  const m = BY_ID.get(id);
  if (!el || !m) return render(false);
  if (S.ui.hideDone && statusOf(m) === "done") { el.remove(); }
  else { const tmp = document.createElement("div"); tmp.innerHTML = matchHtml(m); el.replaceWith(tmp.firstElementChild); }
  updateStatusLine();
}

function fixStickyOffset() {
  const h = document.querySelector("header").getBoundingClientRect().height;
  document.querySelectorAll(".dayhead").forEach(d => d.style.top = Math.round(document.querySelector("header").offsetHeight) + "px");
  document.documentElement.style.setProperty("--hdr", h + "px");
  document.querySelectorAll(".match").forEach(e => e.style.scrollMarginTop = (h + 40) + "px");
}

function placeNowLine() {
  document.querySelectorAll(".nowline").forEach(e => e.remove());
  const now = Date.now();
  const els = listEl.querySelectorAll(".match");
  if (!els.length) return;
  const first = BY_ID.get(els[0].dataset.m), last = BY_ID.get(els[els.length - 1].dataset.m);
  if (now < first.t - 3600e3 || now > last.t + 3600e3) return;
  for (const el of els) {
    if (BY_ID.get(el.dataset.m).t > now) {
      const n = document.createElement("div"); n.className = "nowline"; n.textContent = "NOW " + hm(now);
      (el.previousElementSibling && el.previousElementSibling.classList.contains("dayhead") ? el.previousElementSibling : el).before(n);
      return;
    }
  }
}

// The anchor match: first not-played match after the last played one in this view;
// if nothing is marked yet, the first match that is not clearly in the past.
function nextMatch(ms = viewMatches()) {
  const now = Date.now();
  let lastDone = -1;
  ms.forEach((m, i) => { if (statusOf(m) === "done") lastDone = i; });
  const afterDone = lastDone >= 0 ? ms.slice(lastDone + 1).find(m => statusOf(m) !== "done") : null;
  // Ignore a "last played" mark that is hours stale (e.g. yesterday's practice), fall back to the clock.
  if (afterDone && afterDone.t > now - 3 * 3600e3) return afterDone;
  return ms.find(m => m.t >= now - 10 * 60e3 && statusOf(m) !== "done") || (lastDone >= 0 ? afterDone : ms[0]) || null;
}
// Latest recorded start delta in this view (how far ahead/behind the unit is running).
function runningDelta(ms = viewMatches()) {
  for (let i = ms.length - 1; i >= 0; i--) { const x = peek(ms[i].id); if (x.s === "done" && x.d != null) return x.d; }
  return null;
}
function updateStatusLine() {
  const ms = viewMatches(), n = nextMatch(ms), d = S.ui.timing ? runningDelta(ms) : null;
  let s = `<span class="clock">${hm(Date.now())}</span>`;
  if (n) {
    s += ` · Next <b>${esc(n.label || n.number)}</b> F${n.field} <b>${hm(n.t)}</b>`;
    if (d) s += ` → ~<b>${hm(n.t + d * 60e3)}</b>`;
  }
  if (d != null) s += ` · <span class="delta ${deltaCls(d)}">${fmtDeltaMin(d)}</span>`;
  document.getElementById("statusLine").innerHTML = s;
}

function jumpToNext(smooth = true) {
  const n = nextMatch();
  if (!n) { window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" }); return; }
  let el = document.getElementById("m-" + n.id);
  if (!el) return;
  // Show one previous match for context.
  const prev = el.previousElementSibling;
  const target = prev && (prev.classList.contains("match") || prev.classList.contains("brk")) ? prev : el;
  target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
}

function flash(id) {
  const el = document.getElementById("m-" + id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ---------- Actions ---------- */
function cycleTeam(id, c) {
  snapshot();
  const x = mk(id);
  const cur = x.t[c] || null;
  const nxt = MARK_CYCLE[(MARK_CYCLE.indexOf(cur) + 1) % MARK_CYCLE.length];
  if (nxt) x.t[c] = nxt; else delete x.t[c];
  prune(id); save(); rerenderMatch(id);
}
function cycleStage(id) {
  snapshot();
  const x = mk(id), nxt = STAGES[(STAGES.indexOf(stageOf(id)) + 1) % STAGES.length];
  if (nxt) x.q = nxt; else delete x.q;
  prune(id); save(); rerenderMatch(id);
}
function startMatch(id) {
  snapshot();
  const m = BY_ID.get(id), x = mk(id);
  const d = clockDelta(m);
  x.s = "done";
  // Only auto-record the delta when it is plausible (i.e. we're marking it live, not catching up).
  // With start-time tracking off, a match is just crossed out and any recorded delta is left alone.
  if (S.ui.timing) { if (Math.abs(d) <= 90) x.d = d; else delete x.d; }
  save(); rerenderMatch(id);
  const earlier = openBefore(m, false);
  const label = `${TYPE_LABEL[m.type] || ""} ${m.label || m.number}`;
  const actions = [["Undo", undo], ["Edit", () => openMatchSheet(id)]];
  if (earlier.length) actions.push([`Cross out ${earlier.length} earlier`, () => markEarlierDone(m)]);
  toast(S.ui.timing ? `${label} started${x.d != null ? ` ${fmtDeltaMin(x.d)}` : ""}` : `${label} marked done`, actions, earlier.length ? 9000 : 5000);
}
// Still-open matches listed above `m`, either in the current view or across all fields.
// Matches the volunteer reopened for a replay are left alone.
function openBefore(m, allFields) {
  const pool = allFields ? MATCHES : viewMatches();
  const i = pool.indexOf(m);
  const before = i >= 0 ? pool.slice(0, i) : pool.filter(o => o.t < m.t);
  return before.filter(o => statusOf(o) !== "done" && !(o.played && peek(o.id).s));
}
function markEarlierDone(m, allFields = false) {
  snapshot();
  const earlier = openBefore(m, allFields);
  earlier.forEach(o => { mk(o.id).s = "done"; });
  save(); render(false); flash(m.id);
  toast(`Marked ${earlier.length} earlier match${earlier.length === 1 ? "" : "es"} played`, [["Undo", undo]], 8000);
}

/* ---------- Overlays ---------- */
const overlayRoot = document.getElementById("overlayRoot");
let listDirty = false;  // set by the replay planner; the list is redrawn once it closes
function closeOverlay() {
  overlayRoot.innerHTML = ""; document.body.style.overflow = "";
  if (listDirty) { listDirty = false; render(false); }
}
function openSheet(html, onClick) {
  overlayRoot.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog">${html}</div>`;
  document.body.style.overflow = "hidden";
  overlayRoot.querySelector(".scrim").onclick = closeOverlay;
  overlayRoot.querySelector(".sheet").addEventListener("click", e => {
    const b = e.target.closest("[data-a]");
    if (!b) return;
    if (b.dataset.a === "close") return closeOverlay();
    onClick(b, e);
  });
  history.pushState({ overlay: 1 }, "");
}
window.addEventListener("popstate", () => { if (overlayRoot.innerHTML) closeOverlay(); });
const closeBtn = `<button class="btn close" data-a="close" aria-label="Close">✕</button>`;

function openMatchSheet(id) {
  const m = BY_ID.get(id);
  const bulkHtml = () => {
    const inView = openBefore(m, false).length, all = openBefore(m, true).length;
    const viewName = UNITS[S.ui.unit].label + (S.ui.field ? ` (Field ${S.ui.field} only)` : "") + (S.ui.type !== "all" ? `, ${TYPE_LABEL[S.ui.type]}` : "");
    if (!all) return "";
    return `<h3>Catching up</h3>
      <p class="note">Mark every open match listed above this one as played. Matches reopened for a replay are left open.</p>
      <div class="btns">
        ${inView ? `<button class="btn" data-a="bulk" data-all="0">Mark ${inView} earlier played · ${esc(viewName)}</button>` : ""}
        ${all !== inView ? `<button class="btn" data-a="bulk" data-all="1">Mark ${all} earlier played · all fields</button>` : ""}
      </div>`;
  };
  const rpHtml = () => {
    const rp = replayEntry(id);
    if (!rp) return `<div class="btns" style="margin-top:8px"><button class="btn" data-a="rpon">↻ Flag for replay</button></div>`;
    return `<h3>Replay</h3>
      <p class="note">${S.r.done[id] ? "<b>Replayed ✓</b>" : `<b>Flagged for replay</b>${rp.f ? ` · slot ${rp.s + 1} on Field ${rp.f}` : ""}`}</p>
      <div class="btns"><button class="btn" data-a="rpopen">↻ Replay planner</button><button class="btn danger" data-a="rpoff">Remove replay flag</button></div>`;
  };
  const draw = () => {
    const x = peek(id), st = statusOf(m);
    const sbtn = (s, l) => `<button class="btn ${st === s ? "on" : ""}" data-a="status" data-s="${s}">${l}</button>`;
    const trow = c => {
      const v = x.t[c] || "";
      const b = (k, l) => `<button class="btn ${v === k ? "on" : ""}" data-a="mark" data-t="${esc(c)}" data-k="${k}">${l}</button>`;
      return `<div class="trow"><div class="who">${flagHtml(c)}<span>${esc(teamName(c))}</span></div>
        <div class="btns">${b("", "—")}${b("full", "✓ Full")}${b("rep", "R Rep")}${b("unk", "? Unknown")}</div></div>`;
    };
    return `${closeBtn}<h2>${TYPE_LABEL[m.type] || ""} ${esc(m.label || m.number)}</h2>
      <div class="btns" style="align-items:center">${fieldBadge(m)}<span class="time">${hmH(m.t)}</span><span class="note">${fDay.format(m.t)}</span></div>
      <h3>Status</h3>
      <div class="btns">${sbtn("idle", "Not started")}${sbtn("queue", "Queuing")}${sbtn("done", "Played ✕")}</div>
      ${st === "queue" ? `<div class="btns" style="margin-top:8px">${STAGES.map(k => `<button class="btn ${stageOf(id) === k ? "on" : ""}" data-a="stage" data-k="${k}">${STAGE_LABEL[k]}</button>`).join("")}</div>` : ""}
      ${rpHtml()}
      ${m.played ? `<p class="note">Listed as played on results.first.global${x.s && x.s !== "done" ? ", but reopened here (replay)" : ""}. Choose “Not started” or “Queuing” to reopen it for a replay.</p>` : ""}
      ${S.ui.timing ? `<h3>Start time vs schedule (minutes)</h3>
      <div class="stepper"><button class="btn" data-a="d" data-v="-5">−5</button><button class="btn" data-a="d" data-v="-1">−1</button>
        <span class="val delta ${x.d == null ? "none" : deltaCls(x.d)}">${x.d == null ? "—" : fmtDelta(x.d)}</span>
        <button class="btn" data-a="d" data-v="1">+1</button><button class="btn" data-a="d" data-v="5">+5</button></div>
      <div class="btns" style="margin-top:8px">${Math.abs(Date.now() - m.t) < 3 * 3600e3 ? `<button class="btn primary" data-a="dnow">Started now (${fmtDeltaMin(clockDelta(m))})</button>` : ""}<button class="btn" data-a="dzero">On time</button><button class="btn" data-a="dclear">Clear delta</button></div>
      <p class="note">${x.d == null ? "<b>Not recorded.</b> " : ""}Positive = started late, negative = started early. Setting a delta marks the match played.</p>` : ""}
      ${bulkHtml()}
      ${(S.ui.swap ? ["blue", "red"] : ["red", "blue"]).map(al => `<h3 style="color:var(--${al})">${allianceName(al)} alliance</h3>${m[al].map(trow).join("")}`).join("")}
      <div class="btns" style="margin-top:14px"><button class="btn danger" data-a="clearall">Clear all marks for this match</button></div>`;
  };
  openSheet(draw(), b => {
    if (b.dataset.a === "bulk") { closeOverlay(); markEarlierDone(m, b.dataset.all === "1"); return; }
    if (b.dataset.a === "rpopen") { closeOverlay(); openReplays(); return; }
    if (b.dataset.a === "rpon" || b.dataset.a === "rpoff") {
      setReplay([id], b.dataset.a === "rpon");
      const sheet = overlayRoot.querySelector(".sheet"), top = sheet.scrollTop;
      sheet.innerHTML = draw(); sheet.scrollTop = top;
      return;
    }
    snapshot();
    const x = mk(id);
    switch (b.dataset.a) {
      case "status":
        // "Not started" on a match the results site lists as played must be stored explicitly (e.g. a replay).
        if (b.dataset.s === "idle" && !Object.keys(x.t).length && !m.played) delete x.s; else x.s = b.dataset.s;
        if (x.s !== "done") delete x.d;
        break;
      case "d": x.d = (x.d || 0) + Number(b.dataset.v); x.s = "done"; break;
      case "dnow": x.d = clockDelta(m); x.s = "done"; break;
      case "dzero": x.d = 0; x.s = "done"; break;
      case "dclear": delete x.d; break;
      case "stage": if (b.dataset.k) x.q = b.dataset.k; else delete x.q; break;
      case "mark": if (b.dataset.k) x.t[b.dataset.t] = b.dataset.k; else delete x.t[b.dataset.t]; break;
      case "clearall": if (!confirm("Clear all marks for this match?")) return; delete S.m[id]; break;
    }
    prune(id); save(); rerenderMatch(id);
    const sheet = overlayRoot.querySelector(".sheet"), top = sheet.scrollTop;
    sheet.innerHTML = draw(); sheet.scrollTop = top;
  });
}

function openMenu() {
  const counts = { done: 0, marks: 0 };
  MATCHES.forEach(m => { if (statusOf(m) === "done") counts.done++; });
  Object.values(S.m).forEach(x => { counts.marks += Object.keys(x.t || {}).length; });
  const tb = (k, l) => `<button class="btn ${S.ui.type === k ? "on" : ""}" data-a="type" data-k="${k}">${l}</button>`;
  const legendTeam = (k, l) => `<div class="red"><div class="team ${k ? "m-" + k : ""}"><span class="flag ph"></span><span class="tname">${l}</span><span class="mk">${k ? MARK_INFO[k].glyph : ""}</span></div></div>`;
  openSheet(`${closeBtn}<h2>Queue sheet</h2>
    <p class="note">${esc(D.event.name || "")}<br>Times shown in event local time (${esc(TZ)}).</p>
    <h3>Match types</h3>
    <div class="btns">${tb("all", "All")}${tb("practice", "Practice")}${tb("ranking", "Ranking")}${tb("playoff", "Playoff")}</div>
    <h3>Display</h3>
    <label class="toggle">Hide played (crossed-out) matches <input type="checkbox" data-a="hide" ${S.ui.hideDone ? "checked" : ""}></label>
    <div class="toggle"><span>Alliance on the left<br><span class="note">Match how the field looks from where you stand</span></span>
      <span class="btns"><button class="btn sw-red ${S.ui.swap ? "" : "on"}" data-a="swap" data-v="0">Red</button><button class="btn sw-blue ${S.ui.swap ? "on" : ""}" data-a="swap" data-v="1">Blue</button></span></div>
    <label class="toggle"><span>Track start times<br><span class="note">Start ▶ records how many minutes late/early each match started</span></span> <input type="checkbox" data-a="timing" ${S.ui.timing ? "checked" : ""}></label>
    <label class="toggle">24-hour clock <input type="checkbox" data-a="h24" ${S.ui.h24 ? "checked" : ""}></label>
    ${"wakeLock" in navigator ? `<label class="toggle">Keep screen awake <input type="checkbox" data-a="wake" ${S.ui.wake ? "checked" : ""}></label>` : ""}
    <h3>How to mark</h3>
    <p class="note">Tap a team to cycle its mark. Once a team is marked, tap the match's badge to move it from In queue to On deck to On field. Tap the match number (or long-press a match) for all match options, including <b>Catching up</b>: mark every match above it as played. ${S.ui.timing ? "“Start ▶” crosses the match out and records how many minutes late/early it started." : "“Mark done ✓” crosses the match out."}</p>
    <p class="note"><b>Replays</b> (↻ at the top): flag a match from its sheet or add it by number in the planner. The planner orders them on the side fields so no team plays two at once, adds breaks for back-to-back teams and says where each team goes next.</p>
    <div class="legend">${legendTeam("", "No mark yet")}${legendTeam("full", "✓ Full team with robot")}${legendTeam("rep", "R Representative only, no robot")}${legendTeam("unk", "? Not heard from / status unknown")}</div>
    <h3>Saved on this phone</h3>
    <p class="note">${counts.done} matches played · ${counts.marks} team marks. Saved automatically on every tap.</p>
    <div class="btns"><button class="btn" data-a="export">Export backup</button><button class="btn" data-a="import">Import backup</button><button class="btn danger" data-a="reset">Reset all marks and replays</button></div>
    <h3>Data</h3>
    <p class="note">${MATCHES.length} matches, ${Object.keys(TEAMS).length} teams.<br>Source: ${esc(D.event.source || "")}</p>`,
  b => {
    switch (b.dataset.a) {
      case "type": S.ui.type = b.dataset.k; save(); closeOverlay(); render(true); break;
      case "hide": S.ui.hideDone = b.checked; save(); render(false); break;
      case "wake": S.ui.wake = b.checked; save(); applyWake(); break;
      case "swap":
        S.ui.swap = b.dataset.v === "1"; save(); render(false);
        overlayRoot.querySelectorAll('[data-a="swap"]').forEach(x => x.classList.toggle("on", x === b));
        break;
      case "timing": S.ui.timing = b.checked; save(); render(false); break;
      case "h24": S.ui.h24 = b.checked; save(); setClock(); render(false); break;
      case "export": exportBackup(); break;
      case "import": importBackup(); break;
      case "reset":
        if (confirm("Erase ALL marks and replay flags on this phone? This cannot be undone (except by importing a backup).")) {
          snapshot(); S.m = {}; S.r = normReplays(); save(); closeOverlay(); render(true); toast("All marks reset", [["Undo", undo]]);
        }
        break;
    }
  });
}

function exportBackup() {
  const blob = new Blob([JSON.stringify({ event: D.event.id, exported: new Date().toISOString(), m: S.m, r: S.r }, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `queue-sheet-${D.event.id}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importBackup() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    f.text().then(txt => {
      const p = JSON.parse(txt);
      if (!p || typeof p.m !== "object") throw new Error("not a backup file");
      if (p.event !== D.event.id && !confirm(`Backup is for "${p.event}", not "${D.event.id}". Import anyway?`)) return;
      snapshot(); S.m = p.m; if (p.r) S.r = normReplays(p.r); save(); closeOverlay(); render(true); toast("Backup imported", [["Undo", undo]]);
    }).catch(e => alert("Could not import: " + e.message));
  };
  inp.click();
}

/* ---------- Replay planner ---------- */
const mLabel = m => `${TYPE_LABEL[m.type] || ""} ${m.label || m.number}`.trim();
const plannerOpen = () => !!document.querySelector(".rpl");
function updateReplayBadge() {
  const n = S.r.ids.filter(id => !S.r.done[id]).length, b = document.getElementById("rpBadge");
  b.textContent = n; b.classList.toggle("hidden", !n);
}
function setReplay(ids, on) {
  snapshot();
  const R = S.r;
  for (const id of ids) {
    if (on) { if (!R.ids.includes(id)) R.ids.push(id); }
    else { R.ids = R.ids.filter(x => x !== id); delete R.done[id]; }
  }
  syncReplays(false); save();
  if (plannerOpen()) { listDirty = true; drawReplays(); return; }
  render(false);
  toast(`${mLabel(BY_ID.get(ids[0]))} ${on ? "flagged for replay" : "removed from replays"}`, [["Undo", undo], ...(on ? [["Planner", openReplays]] : [])]);
}
// Adds matches typed by number ("112", "112 140, 151").
function addReplays(text) {
  const nums = String(text).split(/[^0-9]+/).filter(Boolean).map(Number);
  if (!nums.length) { rpMsg = ["Type a match number.", true]; return drawReplays(); }
  const add = [], dup = [], bad = [];
  for (const n of nums) {
    const ms = MATCHES.filter(m => m.number === n);
    // If a number is used twice (e.g. practice and ranking), take the latest one already started.
    const m = ms.filter(o => o.t <= Date.now()).pop() || ms[0];
    if (!m) bad.push(n);
    else if (S.r.ids.includes(m.id) || add.includes(m.id)) dup.push(n);
    else add.push(m.id);
  }
  if (add.length) setReplay(add, true);
  rpMsg = [[add.length && `Added ${add.map(id => mLabel(BY_ID.get(id))).join(", ")}`,
    dup.length && `already listed: ${dup.join(", ")}`, bad.length && `no match ${bad.join(", ")}`].filter(Boolean).join(" · "), !add.length];
  drawReplays();
}
// Hand edits: move a replay one slot earlier/later (swapping with the match of the same pair
// there), or to another field (swapping pairs with the match that uses that pair in its slot).
function moveReplay(id, how, f) {
  const P = S.r.plan, e = P.find(p => p.id === id);
  const other = (s, pr) => P.find(p => p !== e && p.s === s && pairOf(p.f) === pr);
  if (how === "fld") {
    const o = other(e.s, pairOf(f));
    if (o) o.f = e.f;
    e.f = f;
  } else {
    const t = e.s + (how === "up" ? -1 : 1), o = other(t, pairOf(e.f));
    if (o) o.s = e.s;
    e.s = t;
  }
  renumber(P);
  S.r.manual = true;
}
function moveText(a, b) {
  if (b.r === a.r) return `⚠ Also in slot ${b.r + 1} on F${b.f} at the same time`;
  const n = Math.abs(b.f - a.f);
  const to = b.f !== a.f ? `Go to F${b.f} ${allianceName(b.al)} (${n} field${n > 1 ? "s" : ""} toward F${b.f > a.f ? 5 : 1})`
    : b.al === a.al ? `Stay at F${b.f} ${allianceName(b.al)}` : `Stay on F${b.f}, switch to ${allianceName(b.al)}`;
  return `Next: ${to} · slot ${b.r + 1}${b.r - a.r === 1 ? " · back-to-back, break" : ""}`;
}

let rpEdit = false, rpMsg = null;
function openReplays() {
  rpEdit = false; rpMsg = null;
  overlayRoot.innerHTML = `<div class="search rpl" role="dialog" aria-label="Replays"><div class="bar">
      <input id="rpNum" type="text" inputmode="numeric" placeholder="Add match #" autocomplete="off" enterkeyhint="done">
      <button class="btn" data-a="add">Add</button>
      <button class="iconbtn" data-a="close" aria-label="Close">✕</button></div><div class="results" id="rp"></div></div>`;
  document.body.style.overflow = "hidden";
  history.pushState({ overlay: 1 }, "");
  syncReplays(false); save();
  const inp = document.getElementById("rpNum");
  const add = () => { addReplays(inp.value); inp.value = ""; };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  overlayRoot.querySelector(".rpl").addEventListener("click", e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a, id = b.dataset.m, R = S.r;
    rpMsg = null;
    switch (a) {
      case "close": return history.back();
      case "add": add(); return;
      case "rm": return setReplay([id], false);
      case "mode": R.mode = b.dataset.k; syncReplays(true); break;
      case "opt": syncReplays(true); rpMsg = ["Order re-optimized.", false]; break;
      case "edit": rpEdit = !rpEdit; break;
      case "done": if (R.done[id]) delete R.done[id]; else R.done[id] = 1; break;
      case "up": case "down": case "fld": moveReplay(id, a, Number(b.dataset.f)); break;
      case "cleardone":
        snapshot(); R.ids = R.ids.filter(x => !R.done[x]); R.done = {}; syncReplays(false);
        rpMsg = ["Replayed matches cleared from the list.", false]; break;
      case "clearall":
        if (!confirm("Remove every match from the replay list?")) return;
        snapshot(); S.r = normReplays({ mode: R.mode }); break;
      default: return;
    }
    save(); listDirty = true; drawReplays();
  });
  drawReplays();
}

function drawReplays() {
  const box = document.getElementById("rp"); if (!box) return;
  const R = S.r, top = box.scrollTop;
  const pending = R.ids.filter(id => !R.done[id]);
  const { use } = replayFields(pending.map(id => BY_ID.get(id)), R.mode);
  const modeNote = {
    home: "Replays stay on their own side pair (F1·2 or F4·5).",
    spread: "Replays are spread over both side pairs.",
    "12": "All replays on Fields 1 and 2.", "45": "All replays on Fields 4 and 5.",
  }[use];
  let html = rpMsg ? `<div class="rp-msg${rpMsg[1] ? " bad" : ""}">${esc(rpMsg[0])}</div>` : "";
  const modes = `<h3>Fields</h3><div class="btns">${REPLAY_MODES.map(([k, l]) => `<button class="btn ${R.mode === k ? "on" : ""}" data-a="mode" data-k="${k}">${l}</button>`).join("")}</div>
    <p class="note">${R.mode === "auto" ? `Auto: each side pair plays its own replays while it has two or fewer, otherwise they are spread over both pairs. Now: <b>${esc(modeNote)}</b>` : esc(modeNote)}
    Field 3 never plays replays; its matches go to a side pair.</p>`;
  if (!R.ids.length) {
    box.innerHTML = html + `<div class="empty">No replays yet.<br>Type a match number above, or tap a match number in the list and choose “Flag for replay”.</div>` + modes;
    box.scrollTop = top;
    return;
  }

  const items = R.plan.map(p => replayItem(p.id)), P = R.plan.map(p => ({ s: p.s, f: p.f }));
  const A = scorePlan(items, P);
  const dups = [...A.byTeam].filter(([, a]) => a.length > 1);
  const nBrk = A.brk.filter(Boolean).length;
  const slotsLeft = new Set(R.plan.filter(p => !R.done[p.id]).map(p => p.s)).size;
  const num = it => esc(it.m.label || it.m.number);
  const warn = [
    ...A.clash.map(x => `<li class="bad">⚠ ${esc(teamName(x.c))} ${x.i === x.j ? `is listed twice in match ${num(items[x.i])}` : `is in two matches at once in slot ${x.r + 1} (${num(items[x.j])} and ${num(items[x.i])})`}</li>`),
    ...A.brk.map((cs, r) => cs && `<li>☕ Break before slot ${r + 1}: ${cs.map(c => esc(teamName(c))).join(", ")} play${cs.length > 1 ? "" : "s"} back-to-back</li>`).filter(Boolean),
    dups.length ? `<li>↻ ${dups.length} team${dups.length > 1 ? "s play" : " plays"} more than one replay: ${dups.map(([c, a]) => `${esc(teamName(c))} (${a.length})`).join(", ")}</li>`
      : `<li>✓ No team is in more than one replay.</li>`,
  ];
  html += `<div class="rp-sum"><div class="big">${pending.length} to replay · ${slotsLeft} slot${slotsLeft === 1 ? "" : "s"} · ${nBrk ? `${nBrk} break${nBrk > 1 ? "s" : ""}` : "no breaks"}</div>
    <div class="note">A slot is one match per side pair, played at the same time. No clock times: play them in this order.
      ${R.manual ? "<b>Edited by hand.</b>" : "Order and fields optimized automatically."}</div>
    <ul class="rp-warn">${warn.join("")}</ul>
    <div class="btns" style="margin-top:8px"><button class="btn" data-a="opt">↻ Re-optimize</button><button class="btn ${rpEdit ? "on" : ""}" data-a="edit">✎ Edit order</button>
      ${pending.length < R.ids.length ? `<button class="btn" data-a="cleardone">Clear replayed</button>` : ""}<button class="btn danger" data-a="clearall">Clear list</button></div></div>`;

  const card = i => {
    const it = items[i], p = P[i], m = it.m, done = !!R.done[it.id];
    const team = ([c, al]) => {
      const ap = A.byTeam.get(c), k = ap.findIndex(x => x.i === i && x.al === al), me = ap[k];
      const dup = ap.length > 1, clash = ap.some(x => x !== me && x.r === me.r);
      const go = dup ? (ap[k + 1] ? moveText(me, ap[k + 1]) : "Last replay") : "";
      return `<div class="team rteam${dup ? " dup" : ""}${clash ? " clash" : ""}" data-t="${esc(c)}">${flagHtml(c)}<span class="tname">${esc(teamName(c))}${go ? `<small class="go">${esc(go)}</small>` : ""}</span>${dup ? `<span class="mk">${k + 1}/${ap.length}</span>` : ""}</div>`;
    };
    const fb = f => `<button class="btn ${p.f === f ? "on" : ""}" data-a="fld" data-m="${esc(it.id)}" data-f="${f}">F${f}</button>`;
    return `<div class="match rmatch st-${done ? "done" : "idle"}" data-m="${esc(it.id)}" data-slot="${p.s}" data-f="${p.f}">
      <div class="meta">
        <div class="row"><span class="fld f${p.f}">F${p.f}</span><span class="mid"><span class="mtype">Replay</span><span class="mnum">${num(it)}</span></span>
          <span class="was">was F${m.field}<br>${hm(m.t)} ${fDay.format(m.t).split(" ")[0].slice(0, 3)}</span></div>
        <span class="spacer"></span>
        <div class="row"><button class="btn ${done ? "" : "primary"}" data-a="done" data-m="${esc(it.id)}">${done ? "Replayed ✓ · undo" : "Played ✓"}</button></div>
      </div>
      <div class="alliance red">${it.teams.filter(t => t[1] === "red").map(team).join("")}</div>
      <div class="alliance blue">${it.teams.filter(t => t[1] === "blue").map(team).join("")}</div>
      ${rpEdit && !done ? `<div class="btns edit"><button class="btn" data-a="up" data-m="${esc(it.id)}" aria-label="Earlier">↑</button><button class="btn" data-a="down" data-m="${esc(it.id)}" aria-label="Later">↓</button>
          ${[1, 2, 4, 5].map(fb).join("")}<button class="btn danger" data-a="rm" data-m="${esc(it.id)}" aria-label="Remove">✕</button></div>` : ""}
    </div>`;
  };
  A.order.forEach((s, r) => {
    if (A.brk[r]) html += `<div class="brk short" role="separator" data-before="${r}"><span class="ico">☕</span><div><div class="lbl">Break</div>
      <div class="sub">${A.brk[r].map(c => esc(teamName(c))).join(", ")} just played: give them time before slot ${r + 1}</div></div></div>`;
    const es = items.map((_, i) => i).filter(i => P[i].s === s).sort((a, b) => P[a].f - P[b].f);
    html += `<div class="slothead" data-slot="${r}"><span class="n">Slot ${r + 1}</span>${es.length > 1 ? "<span>both pairs at once</span>" : ""}</div>` + es.map(card).join("");
  });
  if (dups.length) {
    html += `<h3>Teams with more than one replay</h3>` + dups.map(([c, a]) => `<div class="rp-path" data-t="${esc(c)}"><div class="who">${flagHtml(c)}<span>${esc(teamName(c))}</span></div><ol>
      ${a.map((x, k) => `<li>Slot ${x.r + 1}: <b>F${x.f} ${allianceName(x.al)}</b> (replay of ${num(items[x.i])})${a[k + 1] ? `<br><span class="step">→ ${esc(moveText(x, a[k + 1]))}</span>` : ""}</li>`).join("")}</ol></div>`).join("");
  }
  box.innerHTML = html + modes;
  box.scrollTop = top;
}

/* ---------- Search ---------- */
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const TEAM_INDEX = Object.entries(TEAMS).map(([c, t]) => ({ c, n: norm(t.country || t.name || c), cn: norm(c) }));
function openSearch() {
  overlayRoot.innerHTML = `<div class="search"><div class="bar">
      <input type="search" id="q" placeholder="Search country…" autocomplete="off" autocapitalize="words" enterkeyhint="search">
      <button class="iconbtn" data-a="close" aria-label="Close">✕</button></div><div class="results" id="sr"></div></div>`;
  document.body.style.overflow = "hidden";
  history.pushState({ overlay: 1 }, "");
  const q = document.getElementById("q"), sr = document.getElementById("sr");
  overlayRoot.querySelector(".search").addEventListener("click", e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    if (b.dataset.a === "close") return history.back();
    if (b.dataset.a === "go") {
      const m = BY_ID.get(b.dataset.m);
      history.back();
      const u = UNITS[S.ui.unit];
      if (!u.fields.includes(m.field) || (S.ui.field && S.ui.field !== m.field) || (S.ui.type !== "all" && S.ui.type !== m.type)) {
        S.ui.unit = m.unit; S.ui.field = 0; S.ui.type = "all";
      }
      if (S.ui.hideDone && statusOf(m) === "done") S.ui.hideDone = false;
      save(); render(false); setTimeout(() => flash(m.id), 50);
    }
  });
  const run = () => {
    const nq = norm(q.value);
    if (!nq) { sr.innerHTML = `<p class="note" style="padding:10px">Type part of a country name.</p>`; return; }
    const words = nq.split(" ");
    const hits = TEAM_INDEX.filter(t => words.every(w => t.n.split(" ").some(tw => tw.startsWith(w)) || t.cn.startsWith(w)))
      .concat(TEAM_INDEX.filter(t => t.n.includes(nq)))
      .filter((t, i, a) => a.findIndex(o => o.c === t.c) === i).slice(0, 10);
    if (!hits.length) { sr.innerHTML = `<p class="note" style="padding:10px">No team found.</p>`; return; }
    const now = Date.now();
    sr.innerHTML = hits.map(({ c }) => {
      const ms = MATCHES.filter(m => m.red.includes(c) || m.blue.includes(c));
      const upcoming = ms.filter(m => statusOf(m) !== "done" && m.t > now - 20 * 60e3);
      const nx = upcoming[0];
      const here = nx && UNITS[S.ui.unit].fields.includes(nx.field);
      const nextHtml = nx
        ? `<div class="next"><div class="dir">${here ? "✓ " : "→ "}${UNITS[nx.unit].fields.map(f => `<span class="fld f${f}">F${f}</span>`).join(" ")} ${UNITS[nx.unit].label}</div>
            Next: <b>${TYPE_LABEL[nx.type]} ${esc(nx.label || nx.number)}</b> on <b>Field ${nx.field}</b> at <b>${hm(nx.t)}</b>,
            <span class="${nx.red.includes(c) ? "al-red" : "al-blue"}" style="color:var(--${nx.red.includes(c) ? "red" : "blue"});font-weight:800">${nx.red.includes(c) ? "Red" : "Blue"}</span>
            ${fDayKey.format(nx.t) !== fDayKey.format(now) ? `<span class="note">(${fDay.format(nx.t)})</span>` : ""}</div>`
        : `<div class="next">No upcoming matches.</div>`;
      const rps = S.r.plan.filter(q => !S.r.done[q.id] && (BY_ID.get(q.id).red.includes(c) || BY_ID.get(q.id).blue.includes(c)))
        .sort((a, b) => a.s - b.s).map(q => {
          const rm = BY_ID.get(q.id), al = rm.red.includes(c) ? "red" : "blue";
          return `<div class="next rpn">↻ Replay of <b>${esc(rm.label || rm.number)}</b>: slot <b>${q.s + 1}</b> on <b>Field ${q.f}</b>,
            <span style="color:var(--${al});font-weight:800">${allianceName(al)}</span></div>`;
        }).join("");
      const items = ms.map(m => {
        const al = m.red.includes(c) ? "red" : "blue";
        const v = peek(m.id).t[c];
        return `<button class="sitem ${statusOf(m) === "done" || m.t < now - 30 * 60e3 ? "past" : ""}" data-a="go" data-m="${esc(m.id)}">
          <span>${TYPE_LABEL[m.type].slice(0, 4)} <b>${esc(m.label || m.number)}</b></span>${fieldBadge(m)}<span>${hm(m.t)}</span>
          <span><span class="al-${al}">${al === "red" ? "Red" : "Blue"}</span> ${v ? MARK_INFO[v].glyph + " " + MARK_INFO[v].label : ""} <span class="note">${fDay.format(m.t).split(" ")[0]}</span></span></button>`;
      }).join("");
      return `<div class="sres"><div class="who">${flagHtml(c)}<span>${esc(teamName(c))}</span></div>${nextHtml}${rps}<div class="slist">${items}</div></div>`;
    }).join("");
  };
  q.addEventListener("input", run);
  run();
  setTimeout(() => q.focus(), 30);
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, actions = [], ms = 5000) {
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${actions.map((a, i) => `<button data-i="${i}">${esc(a[0])}</button>`).join("")}</div>`;
  root.querySelectorAll("button").forEach(b => b.onclick = () => { root.innerHTML = ""; actions[b.dataset.i][1](); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => root.innerHTML = "", ms);
}

/* ---------- Wake lock ---------- */
let wakeLock = null;
async function applyWake() {
  try {
    if (S.ui.wake && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!S.ui.wake && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* not allowed (e.g. file://) */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { applyWake(); updateStatusLine(); placeNowLine(); } });

/* ---------- Events ---------- */
document.getElementById("unitSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (S.ui.unit !== b.dataset.unit) { S.ui.unit = b.dataset.unit; S.ui.field = 0; save(); render(true); }
  else jumpToNext();
});
document.getElementById("fieldSub").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.ui.field = Number(b.dataset.field); save(); render(true);
});
document.getElementById("searchBtn").onclick = openSearch;
document.getElementById("menuBtn").onclick = openMenu;
document.getElementById("rpBtn").onclick = () => openReplays();
document.getElementById("nowBtn").onclick = () => jumpToNext(true);

listEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.m;
  if (b.dataset.act === "team") cycleTeam(id, b.dataset.t);
  else if (b.dataset.act === "sheet") openMatchSheet(id);
  else if (b.dataset.act === "stage") cycleStage(id);
  else if (b.dataset.act === "start") startMatch(id);
  else if (b.dataset.act === "replay") openReplays();
});
// Long-press (contextmenu on Android) on a match opens its full option sheet.
listEl.addEventListener("contextmenu", e => {
  const el = e.target.closest(".match"); if (!el) return;
  e.preventDefault(); openMatchSheet(el.dataset.m);
});

window.addEventListener("resize", () => fixStickyOffset());
setInterval(() => { updateStatusLine(); placeNowLine(); }, 20e3);

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
render(true);
applyWake();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
